/* ============ messages: WhatsApp-style chat per booking ============ */
const MessagesView = {
  id: "messages", large: true, ptr: true, title: () => "Messages",
  render() {
    const side = Nav.role === "business" ? "business" : "customer";
    const bks = side === "customer" ? custBookings() : bizBookings(S.hostBizId);
    const threads = bks.filter(b => threadMsgs(b.id).length).map(b => ({ b, last: threadMsgs(b.id)[threadMsgs(b.id).length - 1], unread: unreadFor(b.id, side) })).sort((a, z) => z.last.at - a.last.at);
    return `<div class="inner"><h1 class="large-title">Messages</h1>
      <p class="lede">${side === "customer" ? "Chat with hosts about each booking." : `Customer chats for ${esc(getB(S.hostBizId)?.name || "your business")}.`}</p>
      ${threads.length ? `<div class="group stagger go" data-skel>${threads.map(({ b, last, unread }, i) => {
        const biz = getB(b.businessId); const v = getV(b.vehicleId); const name = side === "customer" ? biz.name : customerName(b);
        const who = last.from === side ? "You: " : "";
        return `<button type="button" class="thread tap" style="--i:${i}" data-act="openChat" data-id="${b.id}" data-side="${side}">${side === "customer" ? bizLogo(biz) : avatar(name)}<div>
          <div class="th-top"><b>${esc(name)}</b><time>${fmtWhen(last.at)}</time></div>
          <div class="th-sub">${esc(vName(v))} · ${b.ref} · ${fmtDate(b.start)}</div>
          <div class="th-last ${unread ? "unread" : ""}"><span>${esc(who + last.text)}</span>${unread ? `<b class="unread-dot">${unread}</b>` : ""}</div></div></button>`;
      }).join("")}</div>` : emptyState("chat", "No messages yet", side === "customer" ? "Each booking gets its own chat with the host." : "Customer messages for your bookings appear here.")}
    </div>`;
  },
};

function bubbleHTML(m, side, prev) {
  if (m.from === "system") return `<div class="bubble sys">${esc(m.text)}</div>`;
  const mine = m.from === side; const first = !prev || prev.from !== m.from || m.at - prev.at > 30 * MIN;
  return `<div class="bubble ${mine ? "out" : "in"} ${first ? "first" : ""}">${m.auto ? `<span class="auto">Auto-reply · demo</span>` : ""}${esc(m.text)}<span class="meta">${fmtClock(m.at)}${mine ? `<span class="ticks">${icon("ticks")}</span>` : ""}</span></div>`;
}
function msgsHTML(list, side) {
  let html = "", lastDay = null, prev = null;
  for (const m of list) { const d = sod(m.at); if (d !== lastDay) { html += `<div class="day-sep">${fmtDayHeader(m.at)}</div>`; lastDay = d; prev = null; } html += bubbleHTML(m, side, prev); prev = m; }
  return html;
}

const ChatView = {
  id: "chat", hideTabs: true, pageClass: "chat-page",
  title: ctx => { const bk = getBk(ctx.params.id); if (!bk) return "Chat"; return ctx.params.side === "business" ? customerName(bk) : getB(bk.businessId).name; },
  navRight: ctx => `<button type="button" class="nav-btn press" data-act="${ctx.params.side === "business" ? "openHostBooking" : "openTrip"}" data-id="${ctx.params.id}" aria-label="Booking details">${icon("info")}</button>`,
  render(ctx) {
    const bk = getBk(ctx.params.id); if (!bk) return emptyState("chat", "Chat not found", "This booking no longer exists.");
    const v = getV(bk.vehicleId); const side = ctx.params.side;
    return `<div class="inner">
      <button type="button" class="chat-card press" data-act="${side === "business" ? "openHostBooking" : "openTrip"}" data-id="${bk.id}"><img src="${coverURL(v)}" alt=""><div><b>${esc(vFull(v))} · ${bk.ref}</b>${fmtDate(bk.start)} → ${fmtDate(bk.end)} · ${STATUS[bk.status].label}</div>${chev()}</button>
      <div class="msgs" id="msgs">${msgsHTML(threadMsgs(bk.id), side)}</div><div id="typing"></div></div>`;
  },
  fixed(ctx) {
    const side = ctx.params.side; const bk = getBk(ctx.params.id); if (!bk) return "";
    const quick = side === "customer" ? ["What time can I pick up?", "Is the deposit refundable?", "Can you deliver to my hotel?", "Running 30 minutes late, is that OK?"] : null;
    const sugg = side === "business" ? (ctx.local.sugg || []) : [];
    return `<div class="composer glass">
      <div class="sugg hscroll" id="sugg">${side === "business"
        ? `<button type="button" class="chip ai press" data-act="suggest">${icon("sparkles")}${ctx.local.sugg ? "New suggestions" : "Suggest replies"}</button>${ctx.local.loading ? `<span class="chip sk"></span><span class="chip sk"></span>` : sugg.map((t, i) => `<button type="button" class="chip press" data-act="useSugg" data-i="${i}" title="${esc(t)}">${esc(t)}</button>`).join("")}`
        : quick.map(t => `<button type="button" class="chip press" data-act="quick" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <div class="comp-row"><textarea id="chatInput" rows="1" placeholder="Message" data-input="grow" aria-label="Message"></textarea><button type="button" class="send press" data-act="send" aria-label="Send">${icon("send")}</button></div></div>`;
  },
  mount(ctx) {
    const side = ctx.params.side; const id = ctx.params.id;
    if (unreadFor(id, side)) { markRead(S, id, side); Store.save(); Nav.updateBadges(); }
    requestAnimationFrame(() => { ctx.scroller.scrollTop = ctx.scroller.scrollHeight; });
    const ta = ctx.fixed.querySelector("textarea");
    if (ta) ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ChatView.actions.send(null, ctx); } });
  },
  inputs: { grow: t => { t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; } },
  actions: {
    send: (t, ctx) => { const ta = ctx.fixed.querySelector("textarea"); const text = ta.value.trim(); if (!text) return; ta.value = ""; ta.style.height = ""; postChat(ctx, text); },
    quick: (t, ctx) => postChat(ctx, t.dataset.t),
    useSugg: (t, ctx) => { const ta = ctx.fixed.querySelector("textarea"); ta.value = ctx.local.sugg[+t.dataset.i] || ""; ta.focus(); ChatView.inputs.grow(ta); haptic(4); },
    suggest: async (t, ctx) => {
      if (ctx.local.loading) return; ctx.local.loading = true; refreshComposer(ctx);
      const bk = getBk(ctx.params.id);
      try { ctx.local.sugg = await suggestReplies(bk); }
      catch (e) { ctx.local.sugg = localReplySuggestions(bk); if (e && e.code !== "unavailable") toast(e.code === "not_granted" ? "AI declined — showing template replies" : "AI unavailable — showing template replies", { tone: "warn" }); }
      ctx.local.loading = false; refreshComposer(ctx);
    },
  },
};
function refreshComposer(ctx) { const old = ctx.fixed.querySelector("#sugg"); if (!old) return; const tmp = document.createElement("div"); tmp.innerHTML = ChatView.fixed(ctx); const fresh = tmp.querySelector("#sugg"); old.replaceWith(fresh); fresh.classList.add("fade-in"); }
function appendBubble(ctx, m) {
  const box = ctx.content.querySelector("#msgs"); if (!box) return;
  const list = threadMsgs(ctx.params.id); const prev = list[list.length - 2];
  const tmp = document.createElement("div"); tmp.innerHTML = bubbleHTML(m, ctx.params.side, prev && sod(prev.at) === sod(m.at) ? prev : null);
  const el = tmp.firstElementChild; el.classList.add("new"); box.appendChild(el);
  ctx.scroller.scrollTo({ top: ctx.scroller.scrollHeight, behavior: reduced() ? "auto" : "smooth" });
}
function postChat(ctx, text) {
  const side = ctx.params.side, id = ctx.params.id; const m = { from: side, text, at: jmNow() };
  commit(st => { (st.messages[id] = st.messages[id] || []).push(m); markRead(st, id, side); }, { render: false });
  for (const k in Nav.stacks) for (const p of Nav.stacks[k].pages) if (p !== ctx) p.dirty = true;
  appendBubble(ctx, m); haptic(6);
  if (side === "customer") simulateHostReply(ctx, text);
}
function simulateHostReply(ctx, text) {
  const bk = getBk(ctx.params.id); const b = getB(bk.businessId); const v = getV(bk.vehicleId); const t = text.toLowerCase();
  let reply;
  if (/deposit|refund|hold/.test(t)) reply = `Yes, the ${moneyJ(bk.quote.deposit)} deposit is a refundable hold. It’s released 3–5 business days after return if there’s no new damage.`;
  else if (/deliver|hotel|drop/.test(t)) reply = offers(v, "hotel") ? `We can deliver to your hotel for ${moneyJ(v.pickupOpts.hotel.fee)}. Send the hotel name and we’ll add it to the booking.` : "Sorry, this vehicle is pick-up only. We’ll meet you at the pick-up point on your booking.";
  else if (/late|delay|traffic/.test(t)) reply = `No problem, thanks for letting us know. There’s a 59-minute grace period, then late returns are charged by the hour.`;
  else if (/seat|child|baby|pickney/.test(t)) reply = `Child seats are ${moneyJ(EXTRAS.childSeat.perDay)} a day each. Tell us how many and the ages and we’ll have them installed.`;
  else if (/time|pick ?up|when|arriv|flight|land/.test(t)) reply = `Our hours are ${b.hours}. We’ll see you at ${pickupLong(bk)} for your booked time of ${fmtTime(bk.start)}. Share your flight or arrival time if it changes.`;
  else if (/fuel|gas|petrol|diesel/.test(t)) reply = FUEL_POLICIES[b.fuelPolicy].desc;
  else reply = "Thanks for your message! We’ll reply properly as soon as we can.";
  const typing = ctx.content.querySelector("#typing");
  setTimeout(() => { if (!typing.isConnected) return; typing.innerHTML = `<div class="bubble in first" style="width:max-content"><span class="typing"><i></i><i></i><i></i></span></div>`; ctx.scroller.scrollTo({ top: ctx.scroller.scrollHeight, behavior: reduced() ? "auto" : "smooth" }); }, 700);
  setTimeout(() => {
    const m = { from: "business", text: reply, at: jmNow(), auto: true };
    commit(st => { (st.messages[bk.id] = st.messages[bk.id] || []).push(m); if (typing.isConnected && Nav.top() === ctx) markRead(st, bk.id, "customer"); }, { render: false });
    for (const k in Nav.stacks) for (const p of Nav.stacks[k].pages) if (p !== ctx) p.dirty = true;
    if (typing.isConnected) { typing.innerHTML = ""; appendBubble(ctx, m); }
    Nav.updateBadges();
  }, 2100);
}
function localReplySuggestions(bk) {
  const b = getB(bk.businessId); const v = getV(bk.vehicleId); const last = [...threadMsgs(bk.id)].reverse().find(m => m.from === "customer"); const t = (last?.text || "").toLowerCase();
  const out = [];
  if (/time|7:30|early|later|instead|collect|pick/.test(t)) out.push(`Let me check the driver’s schedule and confirm the new time within the hour.`, `That should be fine. Please confirm the exact address for pick-up.`);
  if (/deposit|refund/.test(t)) out.push(`The ${moneyJ(bk.quote.deposit)} deposit is released 3–5 business days after return if there’s no new damage.`);
  if (/deliver|hotel/.test(t)) out.push(offers(v, "hotel") ? `We can deliver to your hotel for ${moneyJ(v.pickupOpts.hotel.fee)}. Which hotel are you staying at?` : `This vehicle is collected from ${vLoc(v)}.`);
  if (/flight|land|arriv/.test(t)) out.push(`Thanks! We’ll track your flight and meet you at ${pickupLong(bk)}.`);
  out.push(`Thanks for booking with ${b.name}! See you on ${fmtDate(bk.start)} at ${fmtTime(bk.start)}.`, `Our hours are ${b.hours}. Call or WhatsApp ${b.whatsapp} if anything changes.`);
  return [...new Set(out)].slice(0, 3);
}

function myBusinesses() { const a = me(); return S.businesses.filter(b => (a.businessIds || []).includes(b.id)); }
function bizSwitcher() {

function bizStatusBanner(b) {
  if (!b) return "";
  if (b.approval === "pending") return `<div class="banner warn">${icon("clock")}<span><b>Awaiting marketplace approval.</b> Your listings stay hidden until an admin approves the business. In this demo, switch to Admin → Businesses to approve it.</span></div>`;
  if (b.approval === "rejected") return `<div class="banner warn">${icon("ban")}<span><b>Application rejected.</b> Update your details and contact the marketplace team.</span></div>`;
  if (b.approval === "suspended") return `<div class="banner warn">${icon("ban")}<span><b>Business suspended.</b> Your listings are hidden from renters.</span></div>`;
  if (!b.verified) return `<div class="banner gold">${icon("shield")}<span><b>Verification pending.</b> Renters can book, but you won’t show the verified badge until the admin checks your ID.</span></div>`;

function barChart(data, o = {}) {
  const W = 320, H = 150, padL = 40, padB = 22, padT = 10; const pw = W - padL - 4, ph = H - padB - padT;
  const max = Math.max(...data.map(d => d.value), 1); const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = Math.ceil(max / p); return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const bw = pw / data.length; const w = Math.max(6, bw * 0.56);
  let g = [0, nice / 2, nice].map(t => { const y = padT + ph - (t / nice) * ph; return `<line class="grid" x1="${padL}" x2="${W - 2}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 3}" text-anchor="end">${moneyShort(t)}</text>`; }).join("");
  g += data.map((d, i) => {
    const h = Math.max(d.value ? 3 : 0, (d.value / nice) * ph); const x = padL + i * bw + (bw - w) / 2; const y = padT + ph - h; const r = Math.min(4, w / 2, h);
    const path = h ? `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z` : "";
    const tip = `${d.label}: ${money(d.value)}`;
    return `${path ? `<path class="bar ${d.current ? "hi" : ""}" style="--i:${i}" data-i="${i}" d="${path}"/>` : ""}<rect class="hit" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ph}" data-act="tip" data-tip="${esc(tip)}" data-i="${i}"><title>${esc(tip)}</title></rect>${i % 2 === (data.length - 1) % 2 ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${d.label}</text>` : ""}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Bar chart")}">${g}</svg><div class="chart-tip" aria-live="polite">${o.hint || "Tap a bar for the exact amount"}</div>`;
}

function setupPhotoDrag(ctx) {
  const grid = ctx.content.querySelector(".ph-grid"); if (!grid) return;
  grid.addEventListener("pointerdown", e => {
    const grip = e.target.closest(".grip"); if (!grip) return; e.preventDefault();
    const tile = grip.closest(".ph-tile"); const tiles = $$(".ph-tile", grid); const from = tiles.indexOf(tile);
    const rects = tiles.map(t => t.getBoundingClientRect()); const sx = e.clientX, sy = e.clientY; let to = from;
    tile.classList.add("dragging"); try { grip.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } haptic(8);
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy; tile.style.transform = `translate3d(${dx}px,${dy}px,0) scale(1.06)`;
      const cx = rects[from].left + rects[from].width / 2 + dx, cy = rects[from].top + rects[from].height / 2 + dy;
      let best = from, bd = Infinity; rects.forEach((r, i) => { const d2 = Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy); if (d2 < bd) { bd = d2; best = i; } });
      if (best !== to) { to = best; haptic(3); tiles.forEach((t, i) => { if (t === tile) return; let target = i; if (from < to && i > from && i <= to) target = i - 1; else if (from > to && i >= to && i < from) target = i + 1; const r0 = rects[i], r1 = rects[target]; t.style.transform = target === i ? "" : `translate3d(${r1.left - r0.left}px,${r1.top - r0.top}px,0)`; }); }
    };
    const up = () => {
      grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
      if (to !== from) { const p = ctx.local.d.photos; const [m] = p.splice(from, 1); p.splice(to, 0, m); }
      const y = ctx.scroller.scrollTop; ctx.local.dir = 0; renderPage(ctx); ctx.scroller.scrollTop = y;
      if (to !== from) toast(to === 0 ? "New cover photo" : "Photos reordered");
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
  });
}

  const inp = (label, k, type = "text", extra = "") => `<div class="field"><label>${label}</label><input class="input" type="${type}" value="${esc(d[k] || "")}" data-input="bf" data-k="${k}" ${extra}></div>`;
  return `<h3 class="group-title">Profile</h3>
    ${seg("kind", [{ v: "business", label: "Business" }, { v: "individual", label: "Individual" }], d.kind || "business", "block")}
    <div style="height:12px"></div>
    ${inp(d.kind === "individual" ? "Name shown to renters" : "Business name", "name", "text", 'placeholder="Your rental company"')}
    <div class="cc-grid"><div class="field"><span class="lab">Parish</span><button type="button" class="select-btn press" data-act="bParish"><span>${esc(d.parish || "Choose")}</span>${icon("chevD")}</button></div><div class="field"><span class="lab">Town</span><button type="button" class="select-btn press" data-act="bTown"><span>${esc(d.town || "Choose")}</span>${icon("chevD")}</button></div></div>
    ${inp("Address", "address", "text", 'placeholder="Street, town"')}
    <div class="cc-grid">${inp("Phone", "phone", "tel", 'placeholder="+1 876-XXX-XXXX" data-phone')}${inp("WhatsApp", "whatsapp", "tel", 'placeholder="+1 876-XXX-XXXX" data-phone')}</div>
    ${inp("Opening hours", "hours", "text", 'placeholder="Mon–Sat 8 AM–6 PM"')}
    <h3 class="group-title">Payments you accept</h3>
    <div class="check-list">${Object.values(PAYMENT_METHODS).map(m => checkItem(m.name + (m.id === "app" ? " (demo)" : ""), !!d.payments?.[m.id], `data-change="bpay" data-v="${m.id}"`, m.icon)).join("")}</div>
    <p class="group-foot">Renters see these on your listings and choose at checkout. In-app card payments are a demo screen until a Jamaican processor (e.g. WiPay or Fygaro) is connected.</p>
    <h3 class="group-title">Payout preference (optional)</h3>
    ${seg("payout", PAYOUT_OPTIONS, d.payout || "later", "block")}
    <h3 class="group-title">Cancellation policy</h3>
    ${seg("policy", Object.values(POLICIES).map(p => ({ v: p.id, label: p.name })), d.policy, "block")}
    <p class="group-foot" id="polDesc">${POLICIES[d.policy].desc}</p>
    <h3 class="group-title">Fuel policy</h3>
    ${seg("fuelPolicy", Object.entries(FUEL_POLICIES).map(([k, p]) => ({ v: k, label: p.name })), d.fuelPolicy, "block")}
    <h3 class="group-title">Deposit & damage policy</h3>
    <textarea class="textarea no-drag" data-input="bf" data-k="damagePolicy" aria-label="Deposit and damage policy">${esc(d.damagePolicy || "")}</textarea>
    <h3 class="group-title">House rules</h3>
    <textarea class="textarea no-drag" data-input="bf" data-k="rules" aria-label="House rules">${esc(d.rules || "")}</textarea>`;
}
const bizFormHandlers = {
  inputs: {
    bf: (t, ctx) => { let v = t.value; if (t.hasAttribute("data-phone")) { v = formatPhone(v); t.value = v; } ctx.local.d[t.dataset.k] = v; },
    bpay: (t, ctx) => { const d = ctx.local.d; d.payments = d.payments || {}; d.payments[t.dataset.v] = t.checked; haptic(3); },
  },
  onSeg(ctx, name, v) { ctx.local.d[name] = v; if (name === "policy") { const p = (ctx.body || ctx.content).querySelector("#polDesc"); if (p) p.textContent = POLICIES[v].desc; } },
  bParish: async (t, ctx) => { const r = await pickParish(ctx.local.d.parish); if (r) { ctx.local.d.parish = r; ctx.local.d.town = ""; t.querySelector("span").textContent = r; const tb = t.closest(".cc-grid").querySelector('[data-act="bTown"] span'); if (tb) tb.textContent = "Choose"; } },
  bTown: async (t, ctx) => { const p = ctx.local.d.parish; if (!p) { toast("Choose a parish first", { tone: "warn" }); return; } const r = await actionSheet({ title: `Town in ${p}`, actions: PARISH_TOWNS[p].map(x => ({ label: x[0], value: x[0] })) }); if (r) { ctx.local.d.town = r; t.querySelector("span").textContent = r; } },
};
function validateBiz(d) {
  const miss = [d.name.trim().length < 2 && "a name", !d.parish && "a parish", !d.town && "a town", !validJmPhone(d.phone) && "a Jamaican phone number (+1 876-XXX-XXXX)", !Object.values(d.payments || {}).some(Boolean) && "at least one payment option"].filter(Boolean);
  return miss.length ? `Add ${miss.join(", ")}.` : "";
}
const BizProfileView = {
  id: "bizprofile", large: true, title: () => "Business",
  navRight: () => `<button type="button" class="nav-btn text press" data-act="save">Save</button>`,
  init(ctx) { const b = getB(S.hostBizId); ctx.local.d = b ? JSON.parse(JSON.stringify(b)) : null; },
  render(ctx) {
    const b = getB(S.hostBizId); if (!b) return emptyState("store", "No business yet", "", `<button type="button" class="btn sm press" data-act="addBiz">Add a business</button>`);
    if (!ctx.local.d || ctx.local.d.id !== b.id) ctx.local.d = JSON.parse(JSON.stringify(b)); const d = ctx.local.d;
    const all = S.vehicles.filter(v => v.businessId === b.id); const allInstant = all.length && all.every(v => v.instantBook);
    return `<div class="inner"><h1 class="large-title">Business</h1>${bizSwitcher()}
      <div class="host-row" style="margin-top:0">
        <label class="file-btn press" style="border-radius:16px" aria-label="Upload logo">${bizLogo(d, "lg")}<input type="file" accept="image/*" data-change="logo"></label>
        <div><b>${esc(d.name)} ${verified(b)}</b><small>Tap the logo to upload a new one</small>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${b.approval === "approved" ? `<span class="pill t-pos">${icon("check")}Approved</span>` : `<span class="pill t-warn">${icon("clock")}${b.approval === "pending" ? "Awaiting approval" : b.approval}</span>`}${b.verified ? `<span class="pill t-pos">${icon("shield")}Verified</span>` : `<span class="pill t-warn">${icon("clock")}Verification pending</span>`}</div></div></div>
      <p class="group-foot">Approval and verification are set by the marketplace admin. ID document: ${b.idDoc?.status === "verified" ? "verified" : b.idDoc?.status === "submitted" ? "submitted, in review" : "not uploaded"}.</p>
      ${bizForm(d, "p")}
      <h3 class="group-title">Booking mode</h3>
      <div class="group"><label class="row"><span class="lbl"><b>Instant book for all vehicles</b><small>Turn off to review every request yourself</small></span>${switchEl("ib_all", allInstant, 'data-change="ibAll"', "Instant book for all vehicles")}</label></div>
      <button type="button" class="btn block press" style="margin-top:22px" data-act="save">Save business profile</button>
      <div class="group icons" style="margin-top:20px">${row({ ic: "user", label: "Your account", sub: `${esc(me().name)} · ${esc(me().email)}`, act: "account" })}${row({ ic: "swap", label: "Switch business", act: "switchBiz" })}${row({ ic: "plus", label: "Add another business", act: "addBiz" })}</div>
    </div>`;
  },
  inputs: { ...bizFormHandlers.inputs,
    logo: async (t, ctx) => { const f = t.files[0]; if (!f) return; try { ctx.local.d.logo = await readImage(f, 240, 0.8); renderPage(ctx); toast("Logo ready. Tap Save to keep it."); } catch (e) { toast(e.message, { tone: "warn" }); } },
    ibAll: (t, ctx) => { const on = t.checked; commit(st => { st.vehicles.forEach(v => { if (v.businessId === S.hostBizId) v.instantBook = on; }); }, { skip: ctx }); toast(on ? "Instant book on for all vehicles" : "All vehicles now need your approval"); },
  },
  onSeg: bizFormHandlers.onSeg,
  actions: { ...hostActions,
    bParish: bizFormHandlers.bParish, bTown: bizFormHandlers.bTown,
    addBiz: () => openAddBusiness(),
    save: (t, ctx) => { const d = ctx.local.d; const err = validateBiz(d); if (err) { toast(err, { tone: "warn", ms: 3200 }); return; } commit(st => { const i = st.businesses.findIndex(b => b.id === d.id); const cur = st.businesses[i]; st.businesses[i] = { ...d, approval: cur.approval, verified: cur.verified }; }); haptic(12); toast("Business profile saved"); },
  },
};
function newBusinessDraft(a) {
  return { id: null, name: a.hostName || "", kind: a.hostKind || "business", parish: a.parish || "", town: "", address: "", phone: a.phone || "", whatsapp: a.phone || "", hours: "Mon–Sat 8:00 AM–6:00 PM", policy: "moderate", fuelPolicy: "full-to-full", payments: { app: true, cash: true, bank: false }, payout: a.payout || "later",
    damagePolicy: "Damage is checked with photos at pick-up and return. Repairs up to the insurance excess come out of the deposit.", rules: "Drive on the left. Seatbelts at all times. No smoking.", approval: "pending", verified: false, color: COLORS[2 + Math.floor(Math.random() * 6)].c, since: new Date(jmNow()).getUTCFullYear(), responseMins: 30, logo: "", sample: false, ownerId: a.id, idDoc: a.idDoc || { status: "none", img: "" } };
}
function createBusinessFor(a, d) {
  d.id = "b" + Date.now().toString(36); d.whatsapp = d.whatsapp || d.phone;
  S.businesses.push({ ...d }); a.businessIds = [...(a.businessIds || []), d.id]; a.activeBizId = d.id; a.roles = { ...(a.roles || {}), host: true }; S.hostBizId = d.id;
  return d.id;
}
function openAddBusiness() {
  const L = { d: newBusinessDraft(me()) };
  Sheets.open({ title: "Add a business", size: "full", local: L,
    render: () => `<div class="banner info">${icon("store")}<span>The marketplace reviews every business, then verifies ID for the shield badge.</span></div>${bizForm(L.d, "s")}<p class="group-foot">Commission: ${S.settings.commission}% of each booking.</p>`,
    footer: () => `<button type="button" class="btn block press" data-act="submit">Submit for review</button>`,
    inputs: bizFormHandlers.inputs, onSeg: bizFormHandlers.onSeg,
    actions: { bParish: bizFormHandlers.bParish, bTown: bizFormHandlers.bTown, submit: (t, s) => {
      const err = validateBiz(L.d); if (err) { toast(err, { tone: "warn", ms: 3200 }); return; }
      commit(() => { createBusinessFor(me(), L.d); }, { render: false });
      s.close(); Nav.setRole("business"); haptic(15); toast("Submitted. Awaiting admin approval.");
    } } });
}
function openBecomeHost() {
  const a = me(); const L = { kind: "business", name: a.hostName || "", parish: a.parish || "", phone: a.phone || "", payout: "later", idImg: a.idDoc?.img || "", agree: false };
  Sheets.open({ title: "Become a host", size: "full",
    render: () => `<p class="auth-sub" style="margin-bottom:16px">List your vehicles on ${esc(CONFIG.APP_NAME)}. Your renter account stays the same; switch between Renter and Host any time.</p>
      <div id="bhErr"></div>
      ${seg("kind", [{ v: "business", label: "Business" }, { v: "individual", label: "Individual" }], L.kind, "block")}
      <div style="height:12px"></div>
      <div class="field"><label for="bhName">${L.kind === "business" ? "Business name" : "Name shown to renters"}</label><input id="bhName" class="input" value="${esc(L.name)}" data-input="name" placeholder="${L.kind === "business" ? "e.g. Island Wheels Ltd" : esc(a.name)}"></div>
      <div class="cc-grid"><div class="field"><span class="lab">Parish</span><button type="button" class="select-btn press" data-act="parish"><span>${esc(L.parish || "Choose")}</span>${icon("chevD")}</button></div><div class="field"><label for="bhPhone">Phone</label><input id="bhPhone" class="input" type="tel" value="${esc(L.phone)}" data-input="phone" placeholder="+1 876-XXX-XXXX"></div></div>
      <div class="field"><span class="lab">ID verification</span><label class="upload-tile"><span class="ut-img">${L.idImg ? `<img src="${L.idImg}" alt="">` : icon("idcard")}</span><div class="ut-txt"><b>${L.idImg ? "Licence photo added" : "Upload your driver’s licence"}</b><span>Placeholder in this demo · stays on this device</span></div><input type="file" accept="image/*" capture="environment" data-change="id"></label></div>
      <div class="field"><span class="lab">Payout preference (optional)</span>${seg("payout", PAYOUT_OPTIONS, L.payout, "block")}</div>
      <label class="check-line"><input type="checkbox" data-change="agree" ${L.agree ? "checked" : ""}><span class="check-box">${icon("check")}</span><span>I agree to the host terms and the ${S.settings.commission}% marketplace commission (demo).</span></label>`,
    footer: () => `<button type="button" class="btn block press" data-act="go">Create host profile</button>`,
    onSeg: (s, name, v) => { L[name] = v; if (name === "kind") { const lab = s.body.querySelector('label[for="bhName"]'); if (lab) lab.textContent = v === "business" ? "Business name" : "Name shown to renters"; } },
    inputs: { name: t => { L.name = t.value; }, phone: t => { t.value = formatPhone(t.value); L.phone = t.value; }, agree: t => { L.agree = t.checked; },
      id: async (t, s) => { const f = t.files[0]; if (!f) return; try { L.idImg = await readImage(f, 1000, 0.75); s.refresh(); toast("Licence photo added"); } catch (e) { toast(e.message, { tone: "warn" }); } } },
    actions: {
      parish: async (t) => { const r = await pickParish(L.parish); if (r) { L.parish = r; t.querySelector("span").textContent = r; } },
      go: (t, s) => {
        const err = L.name.trim().length < 2 ? "Add your business or host name." : !L.parish ? "Choose your parish." : !validJmPhone(L.phone) ? "Use a Jamaican phone number: +1 876-XXX-XXXX." : !L.agree ? "Agree to the host terms to continue." : "";
        const box = s.body.querySelector("#bhErr"); box.innerHTML = err ? `<div class="auth-error fade-in">${icon("alert")}<span>${esc(err)}</span></div>` : ""; if (err) { s.body.scrollTop = 0; haptic(20); return; }
        commit(() => { a.hostKind = L.kind; a.hostName = L.name.trim(); a.payout = L.payout; if (L.idImg) { a.idDoc = { img: L.idImg, status: "submitted" }; a.verified = { ...(a.verified || {}), id: a.verified?.id === "verified" ? "verified" : "submitted" }; } if (!a.phone) a.phone = L.phone;
          const d = newBusinessDraft(a); d.name = L.name.trim(); d.kind = L.kind; d.parish = L.parish; d.town = PARISH_TOWNS[L.parish][0][0]; d.phone = L.phone; d.whatsapp = L.phone; d.payout = L.payout; createBusinessFor(a, d); }, { render: false });
        s.close(); Nav.setRole("business"); haptic(15); toast("You’re a host. List your first vehicle.");
      },
    } });
}

function approvalPill(b) {
  const a = { approved: ["t-green", "check", "Approved"], pending: ["t-orange", "clock", "Pending approval"], rejected: ["t-red", "x", "Rejected"], suspended: ["t-red", "ban", "Suspended"] }[b.approval] || ["t-grey", "info", b.approval];
  return `<span class="pill ${a[0]}">${icon(a[1])}${a[2]}</span>${b.approval === "approved" ? (b.verified ? `<span class="pill t-blue">${icon("shield")}Verified</span>` : `<span class="pill t-gold">${icon("clock")}Unverified</span>`) : ""}`;
}

/* ============ AI rental assistant ============
   Instant answers come from a local parser + the real listings. When the artifact AI is
   available (claude.use("sample"), or the legacy window.claude.complete), it adds a
   conversational answer grounded ONLY in the listing data we pass it. */
const AI = {
  mode: "checking", sample: null, history: [], busy: false, ctl: null,
  async init() {
    const c = window.claude;
    try {
      if (c && typeof c.use === "function") {
        const s = await c.use("sample");
        if (s) { this.sample = s; this.mode = "sample"; this.notify(); return; }
      }
    } catch (e) { /* fall through */ }
    if (c && typeof c.complete === "function") { this.mode = "complete"; this.notify(); return; }
    this.mode = "none"; this.notify();
  },
  available() { return this.mode === "sample" || this.mode === "complete"; },
  notify() { for (const el of $$("[data-ai-status]")) el.outerHTML = aiStatusHTML(); },
  async ask(input, o = {}) {
    if (this.mode === "sample") {
      const opts = { modelTier: "quick", cache: false }; if (o.signal) opts.signal = o.signal; if (o.onText) opts.onText = o.onText;
      if (o.json) return await this.sample.json(input, opts);
      return (await this.sample(input, opts)).text;
    }
    if (this.mode === "complete") {
      const prompt = typeof input === "string" ? input : input.map(t => (t.role === "user" ? "Human: " : "Assistant: ") + t.content).join("\n\n");
      const txt = await window.claude.complete(prompt);
      if (o.signal?.aborted) throw { code: "cancelled" };
      if (o.json) { const m = String(txt).match(/[[{][\s\S]*[\]}]/); if (!m) throw { code: "invalid_json", text: txt }; return JSON.parse(m[0]); }
      o.onText?.({ text: txt, delta: txt });
      return txt;
    }
    throw { code: "unavailable" };
  },
};

/* ---- local understanding of English + Jamaican Patois ---- */
const NUMW = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, twenty: 20, thirty: 30, tree: 3, fi: null };
const PATOIS_RE = /\b(mi|wi|unu|fi|di|wah|weh|nuh|deh|yuh|dem|gwaan|pickney|ting|tek|cyaan|haffi|inna|likkle|wid|seh|ah|bwoy|pon|nah|irie|smaddy|sumaddy|tideh|tumaro|yah)\b/;
/* map free text to a parish / town / airport / area */
const WHERE_ALIASES = [
  [/\b(sangster|mbj|mo ?bay airport|montego bay airport)\b/, { kind: "airport", airport: "mbj" }],
  [/\b(norman manley|nmia|kin airport|kingston airport|palisadoes)\b/, { kind: "airport", airport: "kin" }],
  [/\b(mobay|mo bay|montego( bay)?|hip strip)\b/, { kind: "town", parish: "St James", town: "Montego Bay" }],
  [/\b(ochi|ocho rios)\b/, { kind: "town", parish: "St Ann", town: "Ocho Rios" }],
  [/\b(sav|sav-la-mar|savlamar|savanna-la-mar|savanna la mar|savanna)\b/, { kind: "town", parish: "Westmoreland", town: "Savanna-la-Mar" }],
  [/\b(new kingston)\b/, { kind: "town", parish: "St Andrew", town: "New Kingston" }],
  [/\b(half way tree|hwt)\b/, { kind: "town", parish: "St Andrew", town: "Half Way Tree" }],
  [/\b(kingston|town|corporate area)\b/, { kind: "area", id: "corporate" }],
];
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function parseWhere(t) {
  for (const [re, w] of WHERE_ALIASES.slice(0, 2)) if (re.test(t)) return { ...w };
  for (const [re, w] of WHERE_ALIASES.slice(2, 7)) if (re.test(t)) return { ...w };
  const towns = TOWN_INDEX.slice().sort((a, b) => b.town.length - a.town.length);
  for (const x of towns) { const key = x.town.toLowerCase(); if (key.length >= 4 && !["reading", "junction", "bath", "mona", "hayes", "town"].includes(key) && new RegExp(`(^|[^a-z])${reEsc(key)}([^a-z]|$)`).test(t)) return { kind: "town", parish: x.parish, town: x.town }; }
  for (const [re, w] of WHERE_ALIASES.slice(7)) if (re.test(t)) return { ...w };
  for (const p of PARISHES) { const key = p.toLowerCase(); if (new RegExp(`(^|[^a-z])${reEsc(key).replace("st ", "st\\.? ")}([^a-z]|$)`).test(t)) return { kind: "parish", parish: p }; }
  return null;
}

function parseQuery(raw) {
  let t = " " + String(raw).toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9$.,:/'\- ]+/g, " ") + " ";
  t = t.replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|twenty|thirty|tree)\b/g, w => NUMW[w]);
  const r = { loc: null, type: null, seats: null, trans: null, features: [], maxPrice: null, cheap: false, start: null, end: null, days: null, childSeat: false, intents: [], patois: PATOIS_RE.test(t), bizId: null, vehicleId: null };
  r.where = parseWhere(t);
  if (r.where) r.loc = whereLabel(r.where);
  if (/\b(airport|air port|aiport|airpot|plane|flight|landing)\b/.test(t)) {
    const w = r.where;
    const west = !!w && ((w.kind === "town" && ["St James", "Westmoreland", "Hanover", "Trelawny", "St Ann"].includes(w.parish)) || (w.kind === "parish" && ["St James", "Westmoreland", "Hanover", "Trelawny", "St Ann", "St Elizabeth"].includes(w.parish)));
    const east = !!w && (w.kind === "area" || ["Kingston", "St Andrew", "St Catherine", "St Thomas", "Portland", "Clarendon", "Manchester"].includes(w.parish));
    if (!w || w.kind !== "airport") { if (east) r.where = { kind: "airport", airport: "kin" }; else if (west) r.where = { kind: "airport", airport: "mbj" }; else r.features.push("airport"); }
    if (r.where) r.loc = whereLabel(r.where);
  }
  const T = [[/\b(mini ?bus|bus|buses|coaster|coach|rosa)\b/, "bus"], [/\b(van|vans|minivan|noah|voxy|caravan|hiace)\b/, "van"], [/\b(suv|suvs|jeep|4x4|4 x 4|four wheel|prado|rav ?4|cr-?v|jimny|vitara)\b/, "suv"], [/\b(pickup truck|pick-up truck|pickups|hilux|navara|d-?max|truck)\b/, "pickup"], [/\b(scooter|scooters|moped|vespa|pcx|nmax)\b/, "scooter"], [/\b(bike|bikes|motorbike|motor bike|motorcycle)\b/, "bike"], [/\b(car|cars|sedan|hatchback|saloon|yaris|corolla|axio|swift)\b/, "car"]];
  for (const [re, id] of T) if (re.test(t)) { r.type = id; break; }
  if (!r.type && /\bpickup\b/.test(t) && !/\b(airport pickup|pickup (at|from|time|location|point|in|on))\b/.test(t)) r.type = "pickup";
  let m = t.match(/(\d+)\s*(people|persons|person|passengers|passenger|pax|seats|seater|adults|smaddy|sumaddy|heads|ah we|a we|of we|of us|guests)\b/) || t.match(/\b(?:fi|for|carry|tek|take|hold)\s+(\d+)\b(?!\s*(day|days|night|nights|week|weeks|am|pm|k|000|hour|hours|:))/) || t.match(/\b(family|party|group|crew) of (\d+)/);
  if (m) { const n = +(m[2] && /^\d+$/.test(m[2]) ? m[2] : m[1]); if (n > 0 && n < 60) r.seats = n; }
  if (/\b(automatic|auto)\b/.test(t)) r.trans = "auto"; else if (/\b(manual|stick ?shift|stick)\b/.test(t)) r.trans = "manual";
  if (/(a\/c|\bac\b|air con|aircon|air condition)/.test(t)) r.features.push("ac");
  if (/\b(driver|chauffeur|driva|drive wi|drive we|drive us)\b/.test(t) && !/\b(extra driver|driver'?s licen[cs]e|driver age)\b/.test(t)) r.features.push("driver");
  if (/\b(hotel|deliver|delivery|drop it off|bring it)\b/.test(t)) r.features.push("delivery");
  if (/(child seat|car seat|baby seat|booster|pickney seat|pickney)/.test(t)) r.childSeat = true;
  m = t.match(/(under|below|less than|max|maximum|no more than|nuh more than|cheaper than|budget of|up to)\s*(us\$|\$|j\$|jmd|usd)?\s*([\d,.]+)\s*(k|thousand)?/);
  if (m) { let n = parseFloat(m[3].replace(/,/g, "")); if (m[4]) n *= 1000; const usd = m[2] === "us$" || m[2] === "usd" || (m[2] === "$" && n < 500) || (!m[2] && n < 300); r.maxPrice = Math.round(usd ? n * S.settings.fx : n); }
  if (/\b(cheap|cheapest|budget|lowest|low price|affordable|nuh too dear|not too expensive|inexpensive|save money)\b/.test(t)) r.cheap = true;
  // dates (Jamaica time)
  const T0 = sod(jmNow()); const dowNow = new Date(T0).getUTCDay();
  const DAYS = { sunday: 0, sun: 0, monday: 1, mon: 1, tuesday: 2, tue: 2, tues: 2, wednesday: 3, wed: 3, thursday: 4, thu: 4, thur: 4, thurs: 4, friday: 5, fri: 5, saturday: 6, sat: 6 };
  const until = d => { let n = (d - dowNow + 7) % 7; if (n === 0) n = 7; return n; };
  let sd = null, hour = 10, minute = 0;
  if (/\b(today|tiday|tideh|this evening|tonight|right now|now)\b/.test(t)) sd = 0;
  else if (/\b(tomorrow|tomorra|tumaro|tmrw|tomoro|tomorow|tmr)\b/.test(t)) sd = 1;
  else if (/\b(this )?weekend\b/.test(t)) { sd = until(6); if (dowNow === 6) sd = 0; if (!r.days) r.days = 2; }

    terms: (t, ctx, e) => { e.preventDefault(); openTerms(); },
    eye: (t, ctx) => { ctx.local.show = !ctx.local.show; const inp = ctx.el.querySelector("#pw"); inp.type = ctx.local.show ? "text" : "password"; t.innerHTML = icon(ctx.local.show ? "eyeOff" : "eye"); },
    parish: async (t, ctx) => { const r = await pickParish(ctx.local.parish); if (r) { ctx.local.parish = r; t.innerHTML = `<span>${esc(r)}</span>${icon("chevD")}`; ctx.el.querySelector('.field[data-f="parish"]').classList.remove("err"); } },
    create: async (t, ctx) => {
      const L = ctx.local; if (L.busy) return; const e = {};
      if (L.name.trim().length < 2 || !/\s/.test(L.name.trim())) e.name = "Enter your first and last name.";
      if (!validJmPhone(L.phone)) e.phone = "Use a Jamaican number: +1 876-XXX-XXXX (or 658).";
      else if (S.accounts.some(a => phoneKey(a.phone) === phoneKey(L.phone))) e.phone = "An account already uses this phone. Log in instead.";
      if (!validEmail(L.email)) e.email = "Enter a valid email address.";
      else if (S.accounts.some(a => a.email === L.email.trim().toLowerCase())) e.email = "An account already uses this email. Log in instead.";
      const ps = pwStrength(L.pw); if (!ps.ok) e.pw = "Use 8+ characters with letters and numbers.";
      if (!L.parish) e.parish = "Choose your parish.";
      if (L.role === "host" && L.hostName.trim().length < 2) e.hostName = "Add your business or host name.";
      setFieldErrors(ctx, e);
      const box = ctx.el.querySelector("#suErr"); box.innerHTML = !Object.keys(e).length && !L.terms ? `<div class="auth-error fade-in">${icon("alert")}<span>Agree to the terms to continue.</span></div>` : "";
      if (Object.keys(e).length || !L.terms) { if (!L.terms && !Object.keys(e).length) haptic(20); return; }
      L.busy = true; t.classList.add("loading");
      const salt = randHex(16); const passHash = await hashPassword(L.pw, salt); L.pw = "";
      const host = L.role === "host";
      const acc = { id: uid("u_"), name: L.name.trim().replace(/\s+/g, " "), email: L.email.trim().toLowerCase(), phone: formatPhone(L.phone), salt, passHash, parish: L.parish,
        roles: { renter: !host, host }, businessIds: [], activeBizId: null, avatar: "", createdAt: jmNow(), verified: { email: false, phone: false, id: L.idImg ? "submitted" : "none" },
        licence: "", licenceExpiry: "", age: 25, favs: [], biometric: null, bioOffered: false, demo: false, hostKind: L.kind, hostName: host ? L.hostName.trim() : "", payout: L.payout, idDoc: { img: L.idImg, status: L.idImg ? "submitted" : "none" }, lastRole: host ? "business" : "customer" };
      commit(st => { st.accounts.push(acc); if (host) { const d = newBusinessDraft(acc); d.name = acc.hostName; d.kind = L.kind; d.parish = L.parish; d.town = PARISH_TOWNS[L.parish][0][0]; createBusinessFor(acc, d); } }, { render: false });
      haptic(20); Auth.enter(acc, { remember: L.remember, offerBio: true });
      toast(host ? "Host account created. Your business is awaiting approval." : `Welcome, ${acc.name.split(" ")[0]}`, { ms: 2800 });
    },
  },
};

const LoginScreen = {
  submit: "go",
  init: p => ({ ident: p.ident || "", pw: "", show: false, remember: true, busy: false }),
  render(ctx) {
    const L = ctx.local; const last = S.lastUserId && getAcc(S.lastUserId);
    return `${backBtn()}
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Log in with your email or phone number.</p>
      <div id="liErr"></div>
      <div class="field" data-f="ident"><label for="li_id">Email or phone</label><div class="inp">${icon("user")}<input id="li_id" value="${esc(L.ident)}" data-input="ident" autocomplete="username" placeholder="you@example.com or +1 876-…"></div><span class="ferr"></span></div>
      ${pwField("pw", L.pw, "Password", "eye", L.show)}
      <div style="display:flex;justify-content:flex-end;margin:-6px 0 12px"><button type="button" class="link" data-act="forgot" style="padding:4px 0">Forgot password?</button></div>
      <div class="group" style="margin-bottom:18px"><label class="row"><span class="lbl"><b>Remember me</b><small>Stay signed in on this device</small></span>${switchEl("li_rem", L.remember, 'data-change="remember"', "Remember me")}</label></div>
      <button type="button" class="btn block press ${L.busy ? "loading" : ""}" data-act="go">Log in</button>
      ${last?.biometric ? `<div class="or-sep">or</div><button type="button" class="btn block plain press bio-btn" data-act="bio">${icon(Bio.icon())}Use ${Bio.label()} for ${esc(last.name.split(" ")[0])}</button>` : ""}
      <p class="auth-alt">New here? <button type="button" class="link" data-act="signup" style="padding:0">Create an account</button></p>
      <p class="fineprint">Demo account: ${CONFIG.DEMO_EMAIL} / ${CONFIG.DEMO_PASSWORD}</p>`;
  },
  inputs: { ident: (t, ctx) => { ctx.local.ident = t.value; }, pw: (t, ctx) => { ctx.local.pw = t.value; }, remember: (t, ctx) => { ctx.local.remember = t.checked; } },
  actions: {
    back: () => Auth.go(WelcomeScreen, {}, -1),
    signup: () => Auth.go(SignupScreen, { role: "renter" }),
    forgot: (t, ctx) => Auth.go(ForgotScreen, { ident: ctx.local.ident }),
    eye: (t, ctx) => { ctx.local.show = !ctx.local.show; const inp = ctx.el.querySelector("#pw"); inp.type = ctx.local.show ? "text" : "password"; t.innerHTML = icon(ctx.local.show ? "eyeOff" : "eye"); },
    bio: async () => { const a = getAcc(S.lastUserId); if (a && await Bio.verify(a)) Auth.enter(a, { remember: true }); },
    go: async (t, ctx) => {
      const L = ctx.local; if (L.busy) return; const box = ctx.el.querySelector("#liErr"); const show = m => { box.innerHTML = `<div class="auth-error fade-in">${icon("alert")}<span>${esc(m)}</span></div>`; haptic(20); };
      if (Date.now() < Auth.lockUntil) { show(`Too many attempts. Try again in ${Math.ceil((Auth.lockUntil - Date.now()) / 1000)} seconds.`); return; }
      const e = {}; if (!L.ident.trim()) e.ident = "Enter your email or phone."; if (!L.pw) e.pw = "Enter your password."; setFieldErrors(ctx, e); if (Object.keys(e).length) return;
      const acc = findAccount(L.ident);
      L.busy = true; t.classList.add("loading");
      const ok = acc && (await hashPassword(L.pw, acc.salt)) === acc.passHash;
      L.busy = false; t.classList.remove("loading");
      if (!ok) { Auth.fails++; if (Auth.fails >= 5) { Auth.lockUntil = Date.now() + 30000; Auth.fails = 0; } show(acc ? "That password isn’t right. Try again or reset it." : "We couldn’t find an account with that email or phone."); return; }
      Auth.fails = 0; L.pw = ""; haptic(15);
      Auth.enter(acc, { remember: L.remember, offerBio: true }); toast(`Welcome back, ${acc.name.split(" ")[0]}`);
    },
  },
};

const ForgotScreen = {
  submit: "next",
  init: p => ({ step: "id", ident: p.ident || "", code: "", sent: "", pw: "", show: false, acc: null }),
  render(ctx) {
    const L = ctx.local;
    if (L.step === "id") return `${backBtn()}<h1 class="auth-title">Reset your password</h1><p class="auth-sub">Enter the email or phone on your account and we’ll send a 6-digit code.</p><div id="fgErr"></div>
      <div class="field" data-f="ident"><label for="fg_id">Email or phone</label><div class="inp">${icon("user")}<input id="fg_id" value="${esc(L.ident)}" data-input="ident" autocomplete="username"></div><span class="ferr"></span></div>
      <button type="button" class="btn block press" data-act="next">Send code</button>`;
    if (L.step === "code") return `${backBtn()}<h1 class="auth-title">Enter the code</h1><p class="auth-sub">We sent a 6-digit code to ${esc(L.acc.email.includes("@") && L.ident.includes("@") ? L.acc.email : L.acc.phone)}.</p>
      <div class="mock-banner" style="margin-bottom:14px">${icon("info")}<span><b>Demo:</b> no email or SMS is really sent. Your code is <b class="tnum" style="letter-spacing:.12em">${L.sent}</b>.</span></div>
      <div id="fgErr"></div><div class="otp" role="group" aria-label="6-digit code">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" autocomplete="${i ? "off" : "one-time-code"}" data-input="otp" data-i="${i}" aria-label="Digit ${i + 1}" value="${L.code[i] || ""}">`).join("")}</div>
      <button type="button" class="btn block press" data-act="next">Verify code</button><p class="auth-alt"><button type="button" class="link" data-act="resend" style="padding:0">Send a new code</button></p>`;
    return `${backBtn()}<h1 class="auth-title">Choose a new password</h1><p class="auth-sub">For ${esc(L.acc.email)}.</p><div id="fgErr"></div>
      ${pwField("pw", L.pw, "New password", "eye", L.show, "new-password")}<div id="pwMeter" style="margin:-8px 0 14px">${pwMeterHTML(L.pw)}</div>
      <button type="button" class="btn block press" data-act="next">Save new password</button>`;
  },
  mount(ctx) { const first = ctx.el.querySelector(".otp input"); if (first && !reduced()) setTimeout(() => first.focus(), 450); },
  inputs: {
    ident: (t, ctx) => { ctx.local.ident = t.value; },
    pw: (t, ctx) => { ctx.local.pw = t.value; ctx.el.querySelector("#pwMeter").innerHTML = pwMeterHTML(t.value); },
    otp: (t, ctx) => {
      const boxes = $$(".otp input", ctx.el); const i = +t.dataset.i; const d = digits(t.value);
      if (d.length > 1) { d.slice(0, 6 - i).split("").forEach((c, k) => { boxes[i + k].value = c; }); boxes[Math.min(5, i + d.length - 1)].focus(); }
      else { t.value = d; if (d && i < 5) boxes[i + 1].focus(); }
      ctx.local.code = boxes.map(b => b.value).join("");
      if (ctx.local.code.length === 6) ForgotScreen.actions.next(null, ctx);
    },
  },
  actions: {
    back: (t, ctx) => { const L = ctx.local; if (L.step === "id") Auth.go(LoginScreen, { ident: L.ident }, -1); else { L.step = L.step === "new" ? "code" : "id"; Auth.render(ctx); } },
    resend: (t, ctx) => { ctx.local.sent = String(100000 + Math.floor(Math.random() * 900000)); ctx.local.code = ""; Auth.render(ctx); toast("New code sent (demo)"); },
    eye: (t, ctx) => { ctx.local.show = !ctx.local.show; const inp = ctx.el.querySelector("#pw"); inp.type = ctx.local.show ? "text" : "password"; t.innerHTML = icon(ctx.local.show ? "eyeOff" : "eye"); },
    next: async (t, ctx) => {
      const L = ctx.local; const box = ctx.el.querySelector("#fgErr"); const err = m => { box.innerHTML = `<div class="auth-error fade-in">${icon("alert")}<span>${esc(m)}</span></div>`; haptic(20); };
      if (L.step === "id") { const acc = findAccount(L.ident); if (!acc) { err("We couldn’t find an account with that email or phone."); return; } L.acc = acc; L.sent = String(100000 + Math.floor(Math.random() * 900000)); L.step = "code"; Auth.render(ctx); return; }
      if (L.step === "code") { if (L.code !== L.sent) { err("That code doesn’t match. Check the demo code above."); $$(".otp input", ctx.el).forEach(b => { b.value = ""; }); L.code = ""; ctx.el.querySelector(".otp input")?.focus(); return; } L.step = "new"; Auth.render(ctx); return; }
      if (!pwStrength(L.pw).ok) { err("Use 8+ characters with letters and numbers."); return; }
      const salt = randHex(16); const h = await hashPassword(L.pw, salt); L.pw = "";
      commit(() => { L.acc.salt = salt; L.acc.passHash = h; }, { render: false });
      toast("Password updated. Log in with your new password."); Auth.go(LoginScreen, { ident: L.acc.email }, -1);
    },
  },
};

const LockScreen = {
  init: p => ({ acc: p.acc }),
  render(ctx) {
    const a = ctx.local.acc;
    return `<div class="lock-wrap"><span class="brand-mark" style="width:44px;height:44px;border-radius:12px;margin-bottom:18px">${BRAND_SVG}</span>
      <div class="lock-avatar">${a.avatar ? `<img src="${a.avatar}" alt="">` : esc(initials(a.name))}</div>
      <h1 class="auth-title" style="margin:8px 0 0">Welcome back, ${esc(a.name.split(" ")[0])}</h1><p class="auth-sub">${esc(CONFIG.APP_NAME)} is locked.</p>
      <button type="button" class="btn ink press bio-btn" data-act="unlock" style="min-width:260px">${icon(Bio.icon())}Unlock with ${Bio.label()}</button>
      <button type="button" class="link" data-act="pw">Use password instead</button>
      <button type="button" class="link plain" data-act="out" style="margin-top:16px">Not ${esc(a.name.split(" ")[0])}? Sign out</button>
      ${a.biometric?.type === "simulated" ? `<span class="demo-label" style="margin-top:10px">${Bio.label()} is simulated in this preview</span>` : ""}</div>`;
  },
  actions: {
    unlock: async (t, ctx) => { const a = ctx.local.acc; if (await Bio.verify(a)) { Auth.enter(a, { remember: true }); toast(`Unlocked with ${Bio.label()}`); } },
    pw: (t, ctx) => Auth.go(LoginScreen, { ident: ctx.local.acc.email }),
    out: () => { S.session = null; Store.save(); Auth.go(WelcomeScreen, {}, -1); },
  },
};

function openChangePassword() {
  const a = me(); const L = { cur: "", pw: "" };
  Sheets.open({ title: "Change password", size: "auto",
    render: () => `<div id="cpErr"></div><div class="field"><label for="cp_cur">Current password</label><input id="cp_cur" class="input" type="password" data-input="cur" autocomplete="current-password"></div><div class="field"><label for="cp_new">New password</label><input id="cp_new" class="input" type="password" data-input="pw" autocomplete="new-password"></div><div id="cpMeter">${pwMeterHTML("")}</div>`,
    inputs: { cur: t => { L.cur = t.value; }, pw: (t, s) => { L.pw = t.value; s.body.querySelector("#cpMeter").innerHTML = pwMeterHTML(t.value); } },
    footer: () => `<button type="button" class="btn block press" data-act="save">Update password</button>`,
    actions: { save: async (t, s) => {
      const box = s.body.querySelector("#cpErr"); const err = m => { box.innerHTML = `<div class="auth-error fade-in">${icon("alert")}<span>${esc(m)}</span></div>`; haptic(20); };
      if ((await hashPassword(L.cur, a.salt)) !== a.passHash) { err("Your current password isn’t right."); return; }
      if (!pwStrength(L.pw).ok) { err("Use 8+ characters with letters and numbers."); return; }
      const salt = randHex(16); const h = await hashPassword(L.pw, salt); L.cur = L.pw = "";
      commit(() => { a.salt = salt; a.passHash = h; }, { render: false }); s.close(); toast("Password updated");
    } } });
}

/* ============ boot ============ */
function normalizeState(st) {
  const base = { role: "customer", hostBizId: "b1", settings: {}, search: defaultSearch(), accounts: [], session: null, lastUserId: null, businesses: [], vehicles: [], bookings: [], reviews: [], messages: {}, reads: {}, reports: [] };
  const s = Object.assign(base, st);
  s.settings = Object.assign({ currency: "JMD", fx: CONFIG.FX_DEFAULT, commission: CONFIG.COMMISSION_DEFAULT }, s.settings);
  s.search = Object.assign(defaultSearch(), s.search); if (!Array.isArray(s.search.features)) s.search.features = []; if (!Array.isArray(s.search.payMethods)) s.search.payMethods = []; if (!s.search.where) s.search.where = { kind: "any" };
  if (!s.accounts.length) s.accounts = [demoAccount(jmNow())];
  for (const a of s.accounts) { a.roles = a.roles || { renter: true, host: false }; a.favs = a.favs || []; a.businessIds = a.businessIds || []; a.verified = a.verified || {}; }
  if (!s.businesses.some(b => b.id === s.hostBizId)) s.hostBizId = s.businesses[0]?.id || "b1";
  for (const b of s.businesses) { b.payments = b.payments || { app: true, cash: true, bank: false }; b.town = b.town || PARISH_TOWNS[b.parish]?.[0]?.[0] || ""; }
  for (const v of s.vehicles) {
    v.blocks = v.blocks || []; v.photos = v.photos || []; v.features = v.features || []; v.seasonal = v.seasonal || []; v.rules = v.rules || []; v.customRules = v.customRules || [];
    v.mileage = v.mileage || { limit: null, extraPerKm: 40 }; v.rates = v.rates || { daily: 5000, weekly: 31000, monthly: 110000 };
    v.location = v.location || { parish: "Kingston", town: "", landmark: "" };
    v.pickupOpts = v.pickupOpts || { atLocation: true, airport: { enabled: false, fee: CONFIG.AIRPORT_FEE, airports: [] }, hotel: { enabled: false, fee: CONFIG.HOTEL_FEE } };
    v.title = v.title || `${v.make} ${v.model}`;
  }
  for (const b of s.bookings) { b.events = b.events || []; b.extras = b.extras || {}; if (!b.payment) b.payment = makePayment(b.quote, "app", "deposit", null); }
  s.v = CONFIG.DATA_VERSION;
  return s;
}
async function boot() {
  document.title = CONFIG.APP_NAME;
  for (const el of $$("[data-app-name]")) el.textContent = CONFIG.APP_NAME;
  let st = null;
  try { st = await Store.load(); } catch (e) { st = null; }
  try { st = st ? migrateState(st) : null; } catch (e) { st = null; }
  if (!st || !Array.isArray(st.vehicles)) S = seedState();
  else S = normalizeState(st);
  await ensureDemoPassword();
  if (toMs(S.search.start) < jmNow() - HOUR || toMs(S.search.end) <= toMs(S.search.start)) { const d = defaultSearch(); S.search.start = d.start; S.search.end = d.end; }
  tickStatuses();
  Store.save();
  Nav.init(); Auth.init();
  await Bio.check();
  const bp = $("#bootPage");
  if (bp) { if (reduced()) bp.remove(); else bp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: "ease", fill: "forwards" }).finished.then(() => bp.remove(), () => bp.remove()); }
  const r = Auth.restore();
  if (r && r.remembered && r.acc.biometric) Auth.show(LockScreen, { acc: r.acc });
  else if (r) Auth.enter(r.acc, { remember: r.remembered });
  else Auth.show(WelcomeScreen);
  document.addEventListener("touchstart", () => {}, { passive: true });
  // fixed containers must never scroll (focus() and scrollIntoView can nudge overflow:hidden boxes)
  for (const el of [$("#app"), $("#stage"), $("#auth"), $("#layers")]) el.addEventListener("scroll", () => { if (el.scrollTop || el.scrollLeft) { el.scrollTop = 0; el.scrollLeft = 0; } }, { passive: true });
  setInterval(() => { if (tickStatuses()) { Store.save(); Nav.invalidate(); } }, 60000);
  AI.init();
  try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { DL = d || null; }, () => {}); } catch (e) { /* downloads optional */ }
}
boot();
