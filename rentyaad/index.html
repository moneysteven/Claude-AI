        <span class="ref">${bk.ref}</span>
        <p>${esc(vFull(v))} · ${fmtRange(bk.start, bk.end)}</p>
        <p>${conf ? `Bring the licence you entered. ${esc(b.name)} will meet you at ${esc(LOC[bk.pickup].name)}.` : `${esc(b.name)} usually replies within ${b.responseMins || 30} minutes. Track it in Trips and Messages.`}</p>
        <p class="muted" style="font-size:13px">Deposit ${money(bk.quote.deposit)} paid (mock) · ${money(bk.quote.total)} due at pick-up</p>
      </div>`;
    },
  ];
  const s = Sheets.open({
    title: STEPS[0], size: "full", local: st,
    left: `<button type="button" class="sh-link press" data-act="prev" ${st.step ? "" : "hidden"}>Back</button>`,
    render: () => `<div class="steps-prog" aria-label="Step ${st.step + 1} of 5">${STEPS.map((_, i) => `<i class="${i <= st.step ? "on" : ""}"></i>`).join("")}</div><div class="${reduced() ? "" : st.dir > 0 ? "step-in-r" : "step-in-l"}">${steps[st.step]()}</div>`,
    mount: s => { const back = s.el.querySelector('[data-act="prev"]'); if (back) back.hidden = !(st.step > 0 && st.step < 4); },
    footer: () => {
      const q = Q();
      if (st.step === 4) return `<div class="btn-row"><button type="button" class="btn pill plain press" data-act="msg">${icon("chat")}Message host</button><button type="button" class="btn pill press" data-act="viewTrip">View trip</button></div>`;
      if (st.step === 3) return `<button type="button" class="btn block pill gold press ${st.paying ? "loading" : ""}" data-act="pay">${icon("lock")}${st.paying ? "Processing mock payment…" : `Pay deposit ${money(q.deposit)} (mock)`}</button>`;
      const dis = (st.step === 0 && !AV().ok) || (st.step === 2 && !st.agree);
      return `<div class="bk-foot"><div class="bk-total"><b>${money(q.total)}</b><small>Total · ${money(q.deposit)} deposit held</small></div><button type="button" class="btn pill press" data-act="next" ${dis ? "disabled" : ""}>Continue</button></div>`;
    },
    actions: {
      dates: async (t, s) => { const r = await pickTrip({ start: st.start, end: st.end, which: t.dataset.which }); if (r) { st.start = r.start; st.end = r.end; s.refresh(); } },
      useNext: (t, s) => { st.start = t.dataset.s; st.end = t.dataset.e; s.refresh(); toast("Dates updated"); },
      pickup: (t, s) => { st.pickup = t.dataset.v; for (const r of $$('[data-act="pickup"]', s.body)) r.classList.toggle("on", r.dataset.v === st.pickup); haptic(4); updateLive(s); },
      ins: (t, s) => { st.insurance = t.dataset.v; for (const r of $$('[data-act="ins"]', s.body)) r.classList.toggle("on", r.dataset.v === st.insurance); haptic(4); updateLive(s); },
      expiry: async (t, s) => { const r = await pickMonthYear({ value: st.driver.expiry }); if (r) { st.driver.expiry = r; s.refresh(); } },
      sampleDriver: (t, s) => { Object.assign(st.driver, { name: st.driver.name || "Demo Customer", phone: st.driver.phone || "+1 876-555-0199", licence: "SAMPLE-DL-204518", expiry: "2029-06", age: Math.max(+st.driver.age || 0, v.minAge, 30) }); st.errors = []; s.refresh(); toast("Sample driver details added"); },
      prev: (t, s) => { if (st.step > 0 && st.step < 4) go(s, st.step - 1); },
      next: (t, s) => {
        if (st.step === 0) { if (!AV().ok) { toast("Those dates clash with another booking", { tone: "warn" }); return; } if (st.extras.delivery && !st.extras.hotel.trim()) { toast("Add the hotel for delivery", { tone: "warn" }); s.body.querySelector('[data-input="hotel"]')?.focus(); return; } go(s, 1); }
        else if (st.step === 1) { st.errors = validateDriver(); if (st.errors.length) { s.refresh(); haptic(20); if (!reduced()) s.el.animate([{ transform: "translateX(0)" }, { transform: "translateX(6px)" }, { transform: "translateX(-5px)" }, { transform: "translateX(0)" }], { duration: 280 }); return; } go(s, 2); }
        else if (st.step === 2) { if (!st.agree) return; go(s, 3); }
      },
      pay: async (t, s) => {
        if (st.paying) return;
        const av = AV(); if (!av.ok) { toast("Someone just booked these dates. Pick new ones.", { tone: "warn", ms: 3200 }); go(s, 0); return; }
        st.paying = true; s.refreshFoot(); await wait(reduced() ? 50 : 1100);
        if (!checkAvail(v, st.start, st.end).ok) { st.paying = false; toast("Those dates were just taken.", { tone: "warn" }); go(s, 0); return; }
        st.booking = createBooking(v, st); st.paying = false; haptic(25); go(s, 4); s.el.querySelector('[data-act="prev"]')?.setAttribute("hidden", "");
      },
      viewTrip: (t, s) => { const id = st.booking.id; s.close(); Nav.goTo("trips", TripView, { id }); },
      msg: (t, s) => { const id = st.booking.id; s.close(); Nav.goTo("messages", ChatView, { id, side: "customer" }); },
    },
    onStep: (s, name, val) => { if (name === "childSeat") { st.extras.childSeat = val; updateLive(s); } else if (name === "age") { st.driver.age = val; } },
    inputs: {
      ex: (t, s) => { st.extras[t.dataset.k] = t.checked; haptic(4); if (t.dataset.k === "delivery") { const hr = s.body.querySelector("#hotelRow"); if (hr) { hr.hidden = !t.checked; if (t.checked && !reduced()) hr.animate([{ opacity: 0, transform: "translateY(-6px)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: EASE }); } } updateLive(s); },
      hotel: t => { st.extras.hotel = t.value; },
      drv: t => { st.driver[t.dataset.k] = t.value; },
      saveProf: t => { st.saveProfile = t.checked; },
      agree: (t, s) => { st.agree = t.checked; haptic(6); s.refreshFoot(); },
    },
  });
  return s;
}

function createBooking(v, st) {
  const q = quote(v, st.start, st.end, { extras: st.extras, insurance: st.insurance, pickup: st.pickup });
  const now = jmNow(); const pct = S.settings.commission;
  const bk = {
    id: uid("bk_"), ref: refCode(), vehicleId: v.id, businessId: v.businessId, customerId: "me", guest: null,
    driver: { ...st.driver, age: +st.driver.age }, start: st.start, end: st.end, pickup: st.pickup,
    extras: { ...st.extras }, insurance: st.insurance, quote: q, commissionPct: pct, commission: Math.round(q.hostGross * pct / 100),
    status: v.instantBook ? "confirmed" : "requested", instant: !!v.instantBook, createdAt: now,
    events: [{ at: now, text: v.instantBook ? "Booked with instant book" : "Request sent to host" }, { at: now + 1, text: `Deposit ${moneyJ(q.deposit)} paid (mock)` }],
    checkout: null, checkin: null, cancel: null, depositPaid: true, sample: false,
  };
  commit(s => {
    s.bookings.push(bk);
    pushMsg(s, bk.id, "system", v.instantBook ? `Booking ${bk.ref} confirmed. Deposit ${moneyJ(q.deposit)} paid (mock).` : `Request ${bk.ref} sent. The host will accept or decline soon.`);
    markRead(s, bk.id, "customer");
    if (st.saveProfile) Object.assign(s.profile, { name: st.driver.name, phone: st.driver.phone, licence: st.driver.licence, licenceExpiry: st.driver.expiry, age: +st.driver.age });
  });
  return bk;
}

function openChangeDates(bk) {
  const v = getV(bk.vehicleId); const ct = changeTerms(bk); const L = { start: bk.start, end: bk.end };
  if (!ct.ok) { toast(ct.note, { tone: "warn", ms: 3200 }); return; }
  Sheets.open({ title: ct.extendOnly ? "Change return time" : "Change dates", size: "auto",
    render: () => {
      const av = checkAvail(v, L.start, L.end, bk.id); const q = quote(v, L.start, L.end, { extras: bk.extras, insurance: bk.insurance, pickup: bk.pickup }); const diff = q.total - bk.quote.total + ct.fee;
      const same = L.start === bk.start && L.end === bk.end;
      return `<div class="group icons">
          <button type="button" class="row tap" data-act="pick" ${ct.extendOnly ? "disabled" : ""}>${icoBox("cal")}<span class="lbl"><small>Pick-up${ct.extendOnly ? " · on trip" : ""}</small><b>${fmtDT(L.start)}</b></span>${ct.extendOnly ? "" : chev()}</button>
          <button type="button" class="row tap" data-act="pick" data-which="end">${icoBox("cal", "#5856D6")}<span class="lbl"><small>Return</small><b>${fmtDT(L.end)}</b></span>${chev()}</button></div>
        ${same ? "" : `<div class="status-line ${av.ok ? "ok" : "no"}">${icon(av.ok ? "checkCircle" : "ban")}${av.ok ? "Vehicle is free for the new dates" : esc(av.label) + " — try other dates"}</div>`}
        <div class="breakdown" style="margin-top:12px">

          <div class="bl"><span>New total (${plural(q.days, "day")})</span><b>${money(q.total)}</b></div>
          ${ct.fee ? `<div class="bl fee"><span>Change fee (strict policy)</span><b>${money(ct.fee)}</b></div>` : ""}
          <div class="bl total"><span>${diff >= 0 ? "You’ll pay" : "You’ll save"}</span><b>${money(Math.abs(diff))}</b></div></div>
        <p class="group-foot">${esc(ct.note)} Balances are settled at pick-up or return (mock).</p>`;

        s.close(); haptic(12); toast("Dates updated");
      },
    } });
}

function localReplySuggestions(bk) {

function kpi(label, ic, value, fmt, sub, wide) { return `<div class="kpi ${wide ? "wide" : ""}"><span class="k">${icon(ic)}${label}</span><span class="v" data-count="${value}" data-fmt="${fmt}">${fmt === "money" ? money(value) : value}</span>${sub ? `<span class="s">${sub}</span>` : ""}</div>`; }
function barChart(data, o = {}) {
  const W = 320, H = 150, padL = 40, padB = 22, padT = 10; const pw = W - padL - 4, ph = H - padB - padT;
  const max = Math.max(...data.map(d => d.value), 1); const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = Math.ceil(max / p); return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; })();
  const bw = pw / data.length; const w = Math.max(6, bw * 0.62);
  const ticks = [0, nice / 2, nice];
  let g = ticks.map(t => { const y = padT + ph - (t / nice) * ph; return `<line class="grid" x1="${padL}" x2="${W - 2}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 3}" text-anchor="end">${moneyShort(t)}</text>`; }).join("");
  g += data.map((d, i) => {
    const h = Math.max(d.value ? 3 : 0, (d.value / nice) * ph); const x = padL + i * bw + (bw - w) / 2; const y = padT + ph - h; const r = Math.min(4, w / 2, h);
    const path = h ? `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z` : "";
    const tip = `${d.label}: ${money(d.value)}`;
    return `${path ? `<path class="bar ${d.current ? "hi" : ""}" style="--i:${i}" d="${path}"/>` : ""}<rect class="hit" x="${padL + i * bw}" y="${padT}" width="${bw}" height="${ph}" data-act="tip" data-tip="${esc(tip)}" data-i="${i}"><title>${esc(tip)}</title></rect>${i % 2 === (data.length - 1) % 2 ? `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${d.label}</text>` : ""}`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Bar chart")}">${g}</svg><div class="chart-tip" aria-live="polite">${o.hint || "Tap a bar for the exact amount"}</div>`;
}

const CalendarView = {

  render(ctx) {

    const a = Date.UTC(y, m, 1), z = Date.UTC(y, m + 1, 1);
    const bks = S.bookings.filter(b => b.vehicleId === v.id && ["requested", "confirmed", "active", "completed"].includes(b.status) && overlaps(toMs(b.start), toMs(b.end), a, z)).sort((p, q) => p.start.localeCompare(q.start));

      <div class="bk-veh"><span class="thumb-wrap sk"><img class="thumb fade" src="${coverURL(v)}" alt=""></span><div><b>${esc(vFull(v))}</b><small>${esc(v.plate)} · ${v.maintenance ? "Maintenance mode on" : "In service"}</small></div></div>
      <div class="card" style="margin-top:14px">
        <div class="cal-head"><h3>${MONL[m]} ${y}</h3><div class="btns"><button type="button" class="sh-x press" data-act="prevM" aria-label="Previous month">${icon("chevL")}</button><button type="button" class="sh-x press" data-act="nextM" aria-label="Next month">${icon("chevR")}</button></div></div>
        <div id="grid">${monthGrid(v, y, m, { interactive: true })}</div>${calLegend(true)}
      </div>
      <p class="group-foot">Tap a free day to block it or mark maintenance. Tap a blocked day to free it.</p>
      <h3 class="group-title">Bookings this month</h3>
      <div class="list">${bks.length ? bks.map((b, i) => tripCard(b, i, "host")).join("") : `<div class="group pad"><p>No bookings in ${MONL[m]}.</p></div>`}</div>
    </div>`;
  },
  actions: {
    prevM: (t, ctx) => shiftMonth(ctx, -1), nextM: (t, ctx) => shiftMonth(ctx, 1),
    day: async (t, ctx) => {
      const v = getV(ctx.params.id); const k = t.dataset.k; const ms = toMs(k);
      if (ms < sod(jmNow())) { toast("That day has passed", { tone: "warn" }); return; }
      const bk = S.bookings.find(b => b.vehicleId === v.id && BLOCKING.has(b.status) && overlaps(ms, ms + DAY, toMs(b.start), toMs(b.end)));
      if (bk) { const r = await actionSheet({ title: `${fmtDate(k, true)}`, message: `${esc(customerName(bk))} · ${bk.ref} · ${STATUS[bk.status].host}`, actions: [{ label: "Open booking", value: "open" }] }); if (r === "open") Nav.push(HostBookingView, { id: bk.id }); return; }
      const bl = (v.blocks || []).find(x => x.date === k);
      const r = await actionSheet({ title: fmtDate(k, true), message: bl ? `Currently ${bl.kind === "maintenance" ? "in maintenance" : "blocked"}${bl.note ? ` · ${esc(bl.note)}` : ""}` : "This day is free for bookings.", actions: bl ? [{ label: "Make available", value: "free" }] : [{ label: "Block this day", value: "blocked" }, { label: "Mark maintenance", value: "maintenance" }] });
      if (!r) return;
      commit(st => { const veh = getV(v.id); veh.blocks = (veh.blocks || []).filter(x => x.date !== k); if (r !== "free") veh.blocks.push({ date: k, kind: r, note: r === "maintenance" ? "Maintenance" : "Blocked by host" }); });
      haptic(6); toast(r === "free" ? "Day is available" : r === "maintenance" ? "Marked for maintenance" : "Day blocked");
    },
  },
};
function shiftMonth(ctx, d) {
  let { y, m } = ctx.local; m += d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } ctx.local.y = y; ctx.local.m = m;
  renderPage(ctx); const g = ctx.content.querySelector("#grid"); if (g && !reduced()) g.animate([{ opacity: 0, transform: `translate3d(${d * 30}px,0,0)` }, { opacity: 1, transform: "none" }], { duration: 340, easing: EASE });
}

/* ============ AI rental assistant ============
   Instant answers come from a local parser + the real listings. When the artifact AI is
   available (claude.use("sample"), or the legacy window.claude.complete), it adds a
   conversational answer grounded ONLY in the listing data we pass it. */
const AI = {
  mode: "checking", sample: null, history: [], busy: false, ctl: null,
  async init() {
    const c = window.claude;
    try {
      if (c && typeof c.use === "function") {
        const s = await c.use("sample");
        if (s) { this.sample = s; this.mode = "sample"; this.notify(); return; }
      }
    } catch (e) { /* fall through */ }
    if (c && typeof c.complete === "function") { this.mode = "complete"; this.notify(); return; }
    this.mode = "none"; this.notify();
  },
  available() { return this.mode === "sample" || this.mode === "complete"; },
  notify() { for (const el of $$("[data-ai-status]")) el.outerHTML = aiStatusHTML(); },
  async ask(input, o = {}) {
    if (this.mode === "sample") {
      const opts = { modelTier: "quick", cache: false }; if (o.signal) opts.signal = o.signal; if (o.onText) opts.onText = o.onText;
      if (o.json) return await this.sample.json(input, opts);
      return (await this.sample(input, opts)).text;

    if (this.mode === "complete") {
      const prompt = typeof input === "string" ? input : input.map(t => (t.role === "user" ? "Human: " : "Assistant: ") + t.content).join("\n\n");
      const txt = await window.claude.complete(prompt);
      if (o.signal?.aborted) throw { code: "cancelled" };
      if (o.json) { const m = String(txt).match(/[[{][\s\S]*[\]}]/); if (!m) throw { code: "invalid_json", text: txt }; return JSON.parse(m[0]); }
      o.onText?.({ text: txt, delta: txt });
      return txt;
    }
    throw { code: "unavailable" };
  },
};

2. Availability: "free_for_requested_dates" refers to ${fmtDT(sr.start)} → ${fmtDT(sr.end)} (Jamaica time). Only call a vehicle available if that field is true. Totals in "total_jmd_for_requested_dates" include service fee and 15% GCT but not extras or insurance upgrades.
3. Money is Jamaican dollars (J$). US$ = J$ ÷ ${S.settings.fx}. ${S.settings.currency === "USD" ? "The customer prefers US$, so give US$ after the J$ figure." : "Show J$."} Mention once that prices are sample prices.
4. If the customer writes Jamaican Patois, reply in warm, light Patois that is still easy to read. Otherwise reply in clear, friendly English.
5. Be brief: at most about 110 words, short lines, "- " bullets for options, **bold** for vehicle names. Recommend at most 3 vehicles and say why (seats, price, pick-up point, policy).
6. End with a line "SHOW: id1,id2" listing the vehicle ids you recommended (omit if none).
7. If the customer clearly wants to book one specific vehicle, add a line "BOOK: <id>". The app then opens the booking form with the requested dates. Never claim a booking is made or confirmed.
8. Today in Jamaica: ${fmtDT(nowStr())}.

POLICIES: ${JSON.stringify(policies)}
The app's reading of the latest message: ${JSON.stringify({ location: p.loc ? LOC[p.loc].name : null, type: p.type, min_seats: p.seats, transmission: p.trans, features: p.features, max_daily_jmd: p.maxPrice, cheapest_first: p.cheap, dates: `${sr.start} → ${sr.end}`, patois: p.patois })}
DATA (live listings): ${JSON.stringify(rows)}`;
}
function parseAIText(text) {
  const out = { body: text, show: [], book: null };
  const sm = text.match(/^\s*SHOW:\s*(.+)$/mi); if (sm) out.show = sm[1].split(/[,\s]+/).map(x => x.trim()).filter(id => getV(id) && isLive(getV(id))).slice(0, 3);
  const bm = text.match(/^\s*BOOK:\s*(\S+)/mi); if (bm && getV(bm[1].trim()) && isLive(getV(bm[1].trim()))) out.book = bm[1].trim();
  out.body = text.replace(/^\s*(SHOW|BOOK):.*$/gmi, "").replace(/\n?\s*(S(H(O(W)?)?)?|B(O(O(K)?)?)?)\s*$/, "").trim();
  return out;
}
function mdLite(s) {
  const lines = esc(s).split(/\n+/); let html = "", inList = false;
  for (const raw of lines) { const l = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); if (/^\s*[-•]\s+/.test(l)) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${l.replace(/^\s*[-•]\s+/, "")}</li>`; } else { if (inList) { html += "</ul>"; inList = false; } if (l.trim()) html += `<p>${l}</p>`; } }
  return html + (inList ? "</ul>" : "");
}
function aiMsgHTML(m, i) {
  if (m.role === "user") return `<div class="ai-b user">${esc(m.text)}</div>`;
  const cards = (m.cards || []).map(id => getV(id)).filter(Boolean);
  const src = m.local ? `<div class="src">${icon("bolt")}Instant results · from the listings</div>` : `<div class="src">${icon("sparkles")}Assistant${m.error ? " · offline" : ""}</div>`;
  const body = m.pending && !m.text ? `<div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line"></div>` : `<div class="txt">${mdLite(m.text || "")}</div>`;
  return `<div class="ai-b bot ${m.local ? "local" : ""} ${m.error ? "err" : ""}" data-mi="${i}">${src}${body}
    ${cards.length ? `<div class="hscroll mini-cards no-drag">${cards.map(v => miniCard(v, { start: m.start, end: m.end, pickup: m.pickup, book: true })).join("")}</div>` : ""}
    ${m.book && getV(m.book) ? `<button type="button" class="btn block pill press book-cta" data-act="aiBook" data-id="${m.book}" data-start="${m.start}" data-end="${m.end}" data-pickup="${m.pickup || ""}">${icon("bolt")}Book the ${esc(vName(getV(m.book)))}</button>` : ""}</div>`;
}
const AI_SUGGESTIONS = ["Mi need a van fi 10 people from MoBay airport Friday", "Cheapest automatic car in Kingston this weekend", "Compare SUVs in Ocho Rios for 5 days", "What’s the deposit and cancellation policy for scooters in Negril?", "Bus with driver for a church trip of 20 people next Saturday"];
const AssistantView = {
  id: "assistant", hideTabs: true, pageClass: "ai-page", title: () => "Rental assistant",
  navRight: () => AI.history.length ? `<button type="button" class="nav-btn text press" data-act="clear">Clear</button>` : "",
  render() {
    return `<div class="inner">
      ${aiStatusHTML()}
      ${AI.history.length ? "" : `<div class="ai-hero"><span class="brand-mark">${BRAND_SVG}</span><h2>Ask in English or Patois</h2><p>I search the listings in this app, compare options and explain deposits, cover and cancellation. I never make up prices or availability. All data is SAMPLE.</p></div>
        <div class="ai-sugg stagger go">${AI_SUGGESTIONS.map((s, i) => `<button type="button" class="press" style="--i:${i}" data-act="ask" data-q="${esc(s)}">${icon("sparkles")}<span>${esc(s)}</span></button>`).join("")}</div>`}
      <div class="ai-msgs" id="aiMsgs">${AI.history.map(aiMsgHTML).join("")}</div></div>`;
  },
  fixed: () => `<div class="composer glass ai-composer"><div class="comp-row"><input id="aiInput" type="text" placeholder="Ask about vehicles, prices, policies…" autocomplete="off" enterkeyhint="send" aria-label="Ask the assistant"><button type="button" class="send blue press ${AI.busy ? "stop" : ""}" data-act="${AI.busy ? "stop" : "send"}" aria-label="${AI.busy ? "Stop" : "Send"}">${icon(AI.busy ? "stop" : "send")}</button></div></div>`,
  mount(ctx) {
    requestAnimationFrame(() => { if (AI.history.length) ctx.scroller.scrollTop = ctx.scroller.scrollHeight; });
    ctx.fixed.querySelector("#aiInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); AssistantView.actions.send(null, ctx); } });
  },
  actions: {
    send: (t, ctx) => { const inp = ctx.fixed.querySelector("#aiInput"); const q = inp.value.trim(); if (!q || AI.busy) return; inp.value = ""; aiSend(ctx, q); },
    ask: (t, ctx) => { if (!AI.busy) aiSend(ctx, t.dataset.q); },
    stop: () => AI.ctl?.abort(),
    clear: (t, ctx) => { AI.ctl?.abort(); AI.history = []; renderPage(ctx); },
    aiBook: (t) => { const v = getV(t.dataset.id); if (v) openBooking(v, { start: t.dataset.start, end: t.dataset.end, pickup: t.dataset.pickup || undefined }); },
  },
};
Actions.aiBook = AssistantView.actions.aiBook;
function setSendBtn(ctx) { const b = ctx.fixed.querySelector(".send"); if (!b) return; b.dataset.act = AI.busy ? "stop" : "send"; b.classList.toggle("stop", AI.busy); b.innerHTML = icon(AI.busy ? "stop" : "send"); b.setAttribute("aria-label", AI.busy ? "Stop" : "Send"); }
function appendAI(ctx, m) {
  const box = ctx.content.querySelector("#aiMsgs"); if (!box) return null;
  const hero = ctx.content.querySelector(".ai-hero"); if (hero) { hero.remove(); ctx.content.querySelector(".ai-sugg")?.remove(); Nav.navRight.innerHTML = AssistantView.navRight(ctx); }
  const tmp = document.createElement("div"); tmp.innerHTML = aiMsgHTML(m, AI.history.indexOf(m)); const el = tmp.firstElementChild; if (!reduced()) el.style.animation = "bubbleIn .4s var(--ease) both";
  box.appendChild(el); hydrate(el); ctx.scroller.scrollTo({ top: ctx.scroller.scrollHeight, behavior: reduced() ? "auto" : "smooth" }); return el;
}
function updateAI(ctx, m, el) { if (!el || !el.isConnected) return; const tmp = document.createElement("div"); tmp.innerHTML = aiMsgHTML(m, AI.history.indexOf(m)); const fresh = tmp.firstElementChild; el.replaceWith(fresh); hydrate(fresh); return fresh; }
async function aiSend(ctx, text) {
  const u = { role: "user", text }; AI.history.push(u); appendAI(ctx, u); haptic(5);
  const p = parseQuery(text); const sr = assistantSearch(p);
  const pickup = p.loc && sr.res[0] && vehicleLocs(sr.res[0].v).includes(p.loc) ? p.loc : "";
  const lastLocalIds = [];
  if (hasSearch(p) || p.intents.length || !AI.available()) {
    const la = localAnswer(p, sr);
    const lm = { role: "assistant", local: true, text: la.text, cards: la.ids, start: sr.start, end: sr.end, pickup, book: !p.intents.includes("book") ? null : (p.vehicleId && checkAvail(getV(p.vehicleId), sr.start, sr.end).ok ? p.vehicleId : la.ids.length === 1 ? la.ids[0] : null) };
    AI.history.push(lm); appendAI(ctx, lm); lastLocalIds.push(...la.ids);
  }
  if (!AI.available()) {
    if (AI.mode === "checking") { const n = { role: "assistant", text: "Still connecting to the artifact AI, so this answer came from instant local search. Ask again in a moment for a fuller reply.", error: true }; AI.history.push(n); appendAI(ctx, n); }
    return;
  }
  const m = { role: "assistant", text: "", pending: true, start: sr.start, end: sr.end, pickup }; AI.history.push(m); let el = appendAI(ctx, m);
  AI.busy = true; setSendBtn(ctx); AI.ctl = new AbortController();
  const hist = AI.history.slice(0, -1).filter(x => !x.local && !x.error && x.text).slice(-8).map(x => ({ role: x.role === "user" ? "user" : "assistant", content: x.text }));
  if (hist.length && hist[hist.length - 1].role === "user" && hist[hist.length - 1].content === text) hist.pop();
  const turns = [{ role: "user", content: aiRules(p, sr) }, ...hist, { role: "user", content: text }];
  try {
    const full = await AI.ask(turns, { signal: AI.ctl.signal, onText: ({ text: tx }) => { const parsed = parseAIText(tx); m.text = parsed.body; if (m.pending) { m.pending = false; } el = updateAI(ctx, m, el) || el; } });
    const parsed = parseAIText(full); m.text = parsed.body || "Here’s what I found."; m.pending = false;
    m.cards = parsed.show.filter(id => !lastLocalIds.includes(id)); if (!m.cards.length && !lastLocalIds.length) m.cards = parsed.show;
    m.book = parsed.book; el = updateAI(ctx, m, el) || el;
  } catch (e) {
    m.pending = false; m.error = true; const code = e && e.code;
    if (code === "cancelled") m.text = (e.text ? parseAIText(e.text).body + "\n\n" : "") + "Stopped.";
    else if (code === "not_granted" || code === "sampling_disabled" || code === "capability_disabled" || code === "not_declared") { AI.mode = "denied"; AI.notify(); m.text = "AI access isn’t allowed in this view, so I’ll stick to instant answers from the listings."; }
    else if (code === "rate_limited") m.text = "The AI is busy right now. The instant results above come straight from the listings — try again in a minute.";
    else m.text = (e && e.text ? parseAIText(e.text).body + "\n\n" : "") + "I couldn’t reach the AI just now. The instant results above come straight from the listings.";
    updateAI(ctx, m, el);
  } finally { AI.busy = false; AI.ctl = null; setSendBtn(ctx); ctx.scroller.scrollTo({ top: ctx.scroller.scrollHeight, behavior: reduced() ? "auto" : "smooth" }); }
}

async function suggestReplies(bk) {
  if (!AI.available()) throw { code: "unavailable" };
  const b = getB(bk.businessId), v = getV(bk.vehicleId); const msgs = threadMsgs(bk.id).slice(-8);
  const facts = { host: b.name, hours: b.hours, whatsapp: b.whatsapp, pickup_points: Object.fromEntries(b.pickups.map(l => [LOC[l].name, b.pickupNotes?.[l] || ""])), hotel_delivery: b.delivery ? "yes, J$3,500 flat" : "no", vehicle: vFull(v), seats: v.seats, driver_included: hasFeat(v, "driver"), booking: { ref: bk.ref, status: STATUS[bk.status].host, pickup: fmtDT(bk.start), return: fmtDT(bk.end), location: LOC[bk.pickup].name, customer: customerName(bk) }, extras_jmd: { child_seat_per_day: 800, extra_driver_per_day: 1000, chauffeur_per_day: 6500 }, deposit_jmd: v.deposit, cancellation: POLICIES[b.policy].desc, fuel: FUEL_POLICIES[b.fuelPolicy].desc };
  const prompt = `You help a vehicle rental host in Jamaica reply to a customer inside a DEMO app (all data is sample data). Write 3 short reply options the HOST could send next. Each under 35 words, friendly and professional; light Jamaican warmth is fine. Use ONLY these facts and never invent prices, times or policies. If something isn't covered, the reply should say the host will check and confirm.
FACTS: ${JSON.stringify(facts)}
CONVERSATION (oldest first): ${msgs.map(m => `${m.from}: ${m.text}`).join("\n") || "(no messages yet)"}
Reply with only a JSON array of 3 strings.`;
  const arr = await AI.ask(prompt, { json: true });
  const out = (Array.isArray(arr) ? arr : []).filter(x => typeof x === "string" && x.trim()).map(x => x.trim()).slice(0, 3);
  if (!out.length) throw { code: "empty_completion" };
  return out;
}

/* ============ boot ============ */
function normalizeState(st) {
  const base = { role: "customer", hostBizId: "b1", settings: {}, profile: {}, search: defaultSearch(), favs: [], businesses: [], vehicles: [], bookings: [], reviews: [], messages: {}, reads: {}, reports: [] };
  const s = Object.assign(base, st);
  s.settings = Object.assign({ currency: "JMD", fx: CONFIG.FX_DEFAULT, commission: CONFIG.COMMISSION_DEFAULT }, s.settings);
  s.profile = Object.assign({ name: "Demo Customer", phone: "", email: "", licence: "", licenceExpiry: "", age: 30 }, s.profile);
  s.search = Object.assign(defaultSearch(), s.search); if (!Array.isArray(s.search.features)) s.search.features = [];
  if (!s.businesses.some(b => b.id === s.hostBizId)) s.hostBizId = s.businesses[0]?.id || "b1";
  for (const v of s.vehicles) { v.blocks = v.blocks || []; v.photos = v.photos || []; v.features = v.features || []; v.seasonal = v.seasonal || []; v.mileage = v.mileage || { limit: null, extraPerKm: 40 }; v.rates = v.rates || { daily: 5000, weekly: 31000, monthly: 110000 }; }
  for (const b of s.bookings) { b.events = b.events || []; b.extras = b.extras || {}; }
  s.v = CONFIG.DATA_VERSION;
  return s;
}
async function boot() {
  document.title = CONFIG.APP_NAME;
  for (const el of $$("[data-app-name]")) el.textContent = CONFIG.APP_NAME;
  let st = null;
  try { st = await Store.load(); } catch (e) { st = null; }
  if (!st || st.v !== CONFIG.DATA_VERSION || !Array.isArray(st.vehicles)) S = seedState();
  else S = normalizeState(st);
  // keep the default search window in the future
  if (toMs(S.search.start) < jmNow() - HOUR || toMs(S.search.end) <= toMs(S.search.start)) { const d = defaultSearch(); S.search.start = d.start; S.search.end = d.end; }
  tickStatuses();
  Store.save();
  Nav.init();
  Nav.setRole(S.role || "customer", { animate: false });
  const bp = $("#bootPage");
  if (bp) { if (reduced()) bp.remove(); else bp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: "ease", fill: "forwards" }).finished.then(() => bp.remove(), () => bp.remove()); }
  document.addEventListener("touchstart", () => {}, { passive: true }); // enables :active on iOS
  setInterval(() => { if (tickStatuses()) { Store.save(); Nav.invalidate(); } }, 60000);
  AI.init();
  try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { DL = d || null; }, () => {}); } catch (e) { /* downloads optional */ }
}
boot();
