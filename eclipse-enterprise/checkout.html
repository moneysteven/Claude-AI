<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><title>Checkout | Eclipse Enterprise Limited</title></head>
<body data-page="checkout"><div id="hdr"></div><main id="checkoutMain"><div class="wrap co"><div><span class="eyebrow">Checkout</span><h1 style="font-size:2.4rem;margin:10px 0 26px">Your details</h1>
<form id="orderForm"><div><label>First name</label><input name="first" required></div><div><label>Last name</label><input name="last" required></div><div class="full"><label>Email</label><input name="email" type="email" required></div><div class="full"><label>Phone</label><input name="phone" type="tel" required></div><div class="full"><label>Delivery address</label><input name="address" required></div><div><label>City</label><input name="city" required></div><div><label>State / Region</label><input name="region" required></div><div class="full"><label>Notes (optional)</label><textarea name="notes" rows="3"></textarea></div>
<label class="check full"><input type="checkbox" required> <span>I confirm I am of legal age and that I am permitted to purchase and operate gaming equipment where I live.</span></label>
<label class="check full"><input type="checkbox" required> <span>I understand all sales are final and items are sold as-is with no warranty. Eclipse Enterprise Limited provides support only when I call.</span></label>
<div class="full notice">Online payment is being set up. Submitting sends us an order request and our team will confirm totals, shipping and payment with you directly.</div><button class="btn solid full">Place order request</button></form></div>
<aside class="summary"><h3 style="margin-bottom:16px">Order summary</h3><div id="sum"></div></aside></div></main>
<div id="ftr"></div><script src="js/products.js"></script><script src="js/app.js"></script></body></html>
