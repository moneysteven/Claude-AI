<title>School Connect</title>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app — glass nav bar with collapsing large title, floating glass tab bar,
   inset grouped lists. The Bus tab shows two iPhones (driver + parent); on a phone it switches between them. */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card2: #f2f2f7;
  --fill: rgba(120, 120, 128, 0.12);
  --fill2: rgba(120, 120, 128, 0.2);
  --sep: rgba(60, 60, 67, 0.16);
  --label: #000000;
  --label2: rgba(60, 60, 67, 0.62);
  --label3: rgba(60, 60, 67, 0.32);
  --tint: #007aff;
  --tint-soft: rgba(0, 122, 255, 0.12);
  --green: #34c759;
  --green-ink: #248a3d;
  --green-soft: rgba(52, 199, 89, 0.15);
  --orange: #ff9500;
  --orange-ink: #c93400;
  --orange-soft: rgba(255, 149, 0, 0.15);
  --red: #ff3b30;
  --red-soft: rgba(255, 59, 48, 0.12);
  --indigo: #5856d6;
  --seg-thumb: #ffffff;
  --glass: rgba(249, 249, 251, 0.74);
  --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
  --frame: #1c1c1e;
  --frame-edge: #3a3a3c;
  --map-land: #f5f3ee;
  --map-road: #ffffff;
  --map-road-edge: #e2dccd;
  --map-water: #aadaff;
  --map-park: #d5ead0;
  --map-border: rgba(60, 60, 67, 0.28);
  --road-hw: #f6cf65; --road-hw-case: #e0a93f; --road-main: #fde293; --road-main-case: #e7c25d;
  --road: #ffffff; --road-case: #d5d3cf; --shield-bg: #ffffff; --shield-ink: #3c4043;
  --map-coast: rgba(40, 90, 140, 0.45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --spring: cubic-bezier(0.34, 1.36, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --card2: #2c2c2e; --fill: rgba(118, 118, 128, 0.24); --fill2: rgba(118, 118, 128, 0.34);
    --sep: rgba(84, 84, 88, 0.55); --label: #ffffff; --label2: rgba(235, 235, 245, 0.6); --label3: rgba(235, 235, 245, 0.3);
    --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, 0.2); --green: #30d158; --green-ink: #30d158; --green-soft: rgba(48, 209, 88, 0.18);
    --orange: #ff9f0a; --orange-ink: #ffb340; --orange-soft: rgba(255, 159, 10, 0.2); --red: #ff453a; --red-soft: rgba(255, 69, 58, 0.2);
    --indigo: #5e5ce6; --seg-thumb: #636366; --glass: rgba(28, 28, 30, 0.72);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.12); --frame: #1c1c1e; --frame-edge: #48484a;
    --map-land: #242f3e; --map-road: #3b3f47; --map-road-edge: #2d3037; --map-water: #17263c; --map-park: #23352a; --map-border: rgba(235, 235, 245, 0.22); --map-coast: rgba(120, 180, 230, 0.5);
    --road-hw: #8a7550; --road-hw-case: #5c4d33; --road-main: #6e6551; --road-main-case: #4a4437; --road: #3d4654; --road-case: #2b323d; --shield-bg: #3d4654; --shield-ink: #e8eaed;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card2: #2c2c2e; --fill: rgba(118, 118, 128, 0.24); --fill2: rgba(118, 118, 128, 0.34);
  --sep: rgba(84, 84, 88, 0.55); --label: #ffffff; --label2: rgba(235, 235, 245, 0.6); --label3: rgba(235, 235, 245, 0.3);
  --tint: #0a84ff; --tint-soft: rgba(10, 132, 255, 0.2); --green: #30d158; --green-ink: #30d158; --green-soft: rgba(48, 209, 88, 0.18);
  --orange: #ff9f0a; --orange-ink: #ffb340; --orange-soft: rgba(255, 159, 10, 0.2); --red: #ff453a; --red-soft: rgba(255, 69, 58, 0.2);
  --indigo: #5e5ce6; --seg-thumb: #636366; --glass: rgba(28, 28, 30, 0.72);
  --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(255, 255, 255, 0.12); --frame: #1c1c1e; --frame-edge: #48484a;
  --map-land: #242f3e; --map-road: #3b3f47; --map-road-edge: #2d3037; --map-water: #17263c; --map-park: #23352a; --map-border: rgba(235, 235, 245, 0.22); --map-coast: rgba(120, 180, 230, 0.5);
    --road-hw: #8a7550; --road-hw-case: #5c4d33; --road-main: #6e6551; --road-main-case: #4a4437; --road: #3d4654; --road-case: #2b323d; --shield-bg: #3d4654; --shield-ink: #e8eaed;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--label); font-family: var(--font); font-size: 16px; line-height: 1.38; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.footnote { font-size: 13px; color: var(--label2); margin: 6px 16px 0; }
.sub { color: var(--label2); }
.icon { width: 1em; height: 1em; flex: none; }

/* ---------- Nav bar (glass) ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; transition: background-color 0.25s, box-shadow 0.25s; view-transition-name: navbar; }
.navbar.scrolled { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 0.5px 0 var(--sep); }
.navbar-inner { max-width: 1120px; margin: 0 auto; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-school { font-size: 15px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-title { font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(6px); transition: opacity 0.25s var(--ease), transform 0.3s var(--ease); }
.navbar.scrolled .nav-title { opacity: 1; transform: none; }
.nav-right { justify-self: end; display: flex; gap: 8px; align-items: center; }
.demo-pill { font-size: 12px; font-weight: 600; color: var(--orange-ink); background: var(--orange-soft); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

/* ---------- Page ---------- */
main.in-thread { padding-bottom: 170px; }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 140px; }
.view { display: grid; gap: 26px; }
.largetitle { display: grid; gap: 4px; padding-top: 4px; }
.largetitle h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.12; }
.largetitle p { margin: 0; color: var(--label2); font-size: 16px; max-width: 64ch; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 26px; align-items: start; }
.cols > * { min-width: 0; }

/* Inset grouped list */
.group { display: grid; gap: 7px; min-width: 0; }
.group-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; padding: 0 16px; }
.group-title { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
.card { background: var(--card); border-radius: 14px; min-width: 0; }
.card.pad { padding: 16px; }
.list { overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; position: relative; min-height: 48px; flex-wrap: wrap; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.row .main { min-width: 0; display: grid; gap: 1px; }
.row .title { font-size: 16px; }
.row .detail { font-size: 13px; color: var(--label2); }
.row.tap { cursor: pointer; transition: background-color 0.15s; width: 100%; border: 0; background: none; text-align: left; flex-wrap: nowrap; }
.row.tap:active { background: var(--fill); }
.chev { color: var(--label3); width: 14px; height: 14px; flex: none; transition: transform 0.35s var(--ease); }
.open .chev { transform: rotate(90deg); }
.tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: var(--fill); color: var(--label2); vertical-align: 1px; margin-left: 6px; letter-spacing: 0; }
.tag.path { background: var(--orange-soft); color: var(--orange-ink); }

/* Buttons */
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform 0.25s var(--spring), opacity 0.2s, background-color 0.2s; }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn.filled { background: var(--tint); color: #fff; }
.btn.tinted { background: var(--tint-soft); color: var(--tint); }
.btn.gray { background: var(--fill); color: var(--tint); }
.btn.red { background: var(--red-soft); color: var(--red); }
.btn.big { width: 100%; padding: 15px 18px; font-size: 17px; border-radius: 14px; }
.btn.small { padding: 6px 13px; font-size: 14px; }
.btn[hidden] { display: none; }

/* Segmented control with a sliding thumb */
.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); background: var(--fill); border-radius: 9px; padding: 2px; isolation: isolate; min-width: 0; }
.seg-thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 7px; background: var(--seg-thumb); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); transform: translateX(calc(var(--i) * 100%)); transition: transform 0.38s var(--ease), background-color 0.25s; z-index: -1; will-change: transform; }
.seg button { background: none; border: 0; padding: 6px 10px; font-size: 13px; font-weight: 500; border-radius: 7px; white-space: nowrap; transition: color 0.25s; overflow: hidden; text-overflow: ellipsis; }
.seg button[aria-checked="true"] { font-weight: 600; }
.seg[data-tone="g"] .seg-thumb { background: var(--green); }
.seg[data-tone="o"] .seg-thumb { background: var(--orange); }
.seg[data-tone="r"] .seg-thumb { background: var(--red); }
.seg[data-tone="g"] button[aria-checked="true"], .seg[data-tone="o"] button[aria-checked="true"], .seg[data-tone="r"] button[aria-checked="true"] { color: #fff; }
.seg.wide { width: 100%; }
.seg.lg button { padding: 8px 12px; font-size: 14px; }
.seg.locked { opacity: 0.45; pointer-events: none; }

/* Stat tiles (Health style) */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 13px 15px; display: grid; gap: 6px; }
.stat-label { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--c, var(--tint)); }
.stat-label .icon { width: 17px; height: 17px; }
.stat-value { font-family: var(--font-round); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-value small { font-size: 16px; font-weight: 600; color: var(--label2); margin-left: 2px; }
.stat-note { font-size: 13px; color: var(--label2); }

/* Chips + fields */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--fill); border: 0; border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 500; transition: transform 0.25s var(--spring), background-color 0.2s; }
.chip:active { transform: scale(0.95); }
.field { display: grid; gap: 6px; }
.field-label { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; }
select.ios, textarea.ios { background-color: var(--fill); border: 0; border-radius: 10px; padding: 10px 12px; width: 100%; font-size: 16px; }
textarea.ios { resize: none; min-height: 110px; line-height: 1.4; overflow: hidden; transition: box-shadow 0.2s; -webkit-user-select: text; user-select: text; }
textarea.ios:focus, select.ios:focus { outline: none; box-shadow: 0 0 0 3px var(--tint-soft); }
.counter { font-size: 12px; color: var(--label2); text-align: right; margin-top: -8px; font-variant-numeric: tabular-nums; }
select.ios { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--label2) 50%), linear-gradient(135deg, var(--label2) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }

/* Due pills + rings */
.due { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--fill); color: var(--label2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.soon { background: var(--orange-soft); color: var(--orange-ink); }
.due.over { background: var(--red-soft); color: var(--red); }
.ring { width: 38px; height: 38px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .track { stroke: var(--fill2); }
.ring .bar { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease); }
.sba-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; justify-content: flex-end; }
.expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.42s var(--ease); }
.expand.open { grid-template-rows: 1fr; }
.expand > div { overflow: hidden; min-height: 0; }
.expand-inner { background: var(--card2); }
.expand-inner .row { padding-top: 9px; padding-bottom: 9px; }

/* Floating glass tab bar */
.tabbar { position: fixed; z-index: 55; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-radius: 999px; box-shadow: var(--glass-shadow); padding: 5px; display: grid; grid-template-columns: repeat(5, 1fr); width: min(520px, calc(100vw - 24px)); isolation: isolate; view-transition-name: tabbar; }
.tabbar { transition: transform 0.4s var(--ease), opacity 0.3s; }
body.typing .tabbar { transform: translate(-50%, 160%); opacity: 0; pointer-events: none; }
.tab-thumb { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 5); border-radius: 999px; background: var(--fill); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 0.5s var(--spring); z-index: -1; will-change: transform; }
.tab { background: none; border: 0; display: grid; justify-items: center; gap: 1px; padding: 6px 2px 5px; font-size: 10.5px; font-weight: 600; color: var(--label); border-radius: 999px; position: relative; transition: color 0.25s, transform 0.25s var(--spring); }
.tab:active { transform: scale(0.94); }
.tab .icon { width: 25px; height: 25px; }
.tab[aria-selected="true"] { color: var(--tint); }
.badge { position: absolute; top: 1px; left: calc(50% + 6px); background: var(--red); color: #fff; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; font-variant-numeric: tabular-nums; transform: scale(var(--s, 1)); transition: transform 0.35s var(--spring); }
.badge[hidden] { display: none; }

/* iOS notification banners */
.banners { position: fixed; z-index: 70; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(400px, calc(100vw - 24px)); display: grid; gap: 8px; pointer-events: none; }
.banner { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: start; padding: 11px 13px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); box-shadow: var(--glass-shadow); animation: bannerIn 0.6s var(--spring) both; }
.banner.out { animation: bannerOut 0.35s var(--ease) both; }
.banner .appicon { width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: linear-gradient(180deg, #5ad86e, #28b14a); }
.banner .appicon.school { background: linear-gradient(180deg, #3d9bff, #0066e0); }
.banner .appicon .icon { width: 22px; height: 22px; }
.banner-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.banner-top b { font-weight: 600; }
.banner-top span { color: var(--label2); }
.banner-body { font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes bannerIn { from { transform: translateY(-120%) scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bannerOut { to { transform: translateY(-110%) scale(0.95); opacity: 0; } }

/* ---------- Bus tab: devices ---------- */
.bus-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; }
.bus-controls > .seg { width: 260px; max-width: 100%; }
.device-switch { display: none; }
.phones { display: grid; grid-template-columns: repeat(2, minmax(0, 393px)); gap: 48px; justify-content: center; align-items: start; }
.device-wrap { display: grid; gap: 12px; justify-items: center; min-width: 0; }
.device-label { text-align: center; display: grid; gap: 2px; }
.device-label b { font-size: 17px; }
.device-label span { font-size: 13px; color: var(--label2); }
.device { width: 393px; max-width: 100%; padding: 11px; border-radius: 60px; background: var(--frame); box-shadow: 0 0 0 1.5px var(--frame-edge), 0 30px 60px -20px rgba(0, 0, 0, 0.35); }
.screen { position: relative; height: 780px; border-radius: 50px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; isolation: isolate; }
.statusbar { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 44px; font-size: 16px; font-weight: 600; pointer-events: none; font-variant-numeric: tabular-nums; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar svg { height: 12px; width: auto; }
.island { position: absolute; z-index: 6; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 52px 0 28px; }
.scroll::-webkit-scrollbar { display: none; }
.appnav { position: sticky; top: -52px; z-index: 4; padding: 58px 16px 10px; margin-top: -52px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 0.5px 0 var(--sep); }
.appnav-title { font-size: 17px; font-weight: 600; }
.appnav-sub { font-size: 13px; color: var(--label2); }
.appnav select { appearance: none; -webkit-appearance: none; border: 0; background-color: var(--tint-soft); color: var(--tint); font-weight: 600; font-size: 14px; padding: 6px 28px 6px 12px; border-radius: 999px; max-width: 60%; background-image: linear-gradient(45deg, transparent 50%, var(--tint) 50%), linear-gradient(135deg, var(--tint) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.screen-body { display: grid; gap: 14px; padding: 14px 14px 0; }
.screen-body .group-head, .screen-body .footnote { padding: 0 6px; margin-left: 0; margin-right: 0; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--label); opacity: 0.85; z-index: 6; pointer-events: none; }

/* Driver */
.trip-state { display: grid; gap: 12px; }
.trip-title { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 700; }
.live { width: 10px; height: 10px; border-radius: 50%; background: var(--label3); flex: none; position: relative; }
.live.on { background: var(--green); }
.live.on::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--green); animation: ping 1.6s var(--ease) infinite; }
@keyframes ping { from { transform: scale(1); opacity: 0.6; } to { transform: scale(3); opacity: 0; } }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--sep); border-radius: 14px; overflow: hidden; }
.duo > div { background: var(--card); padding: 13px 15px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.duo .cap { font-size: 13px; color: var(--label2); font-weight: 500; }
.duo .val { font-family: var(--font-round); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.duo .val.text { font-family: var(--font); font-size: 16px; font-weight: 600; line-height: 1.3; }
.feed .row { flex-wrap: nowrap; justify-content: flex-start; animation: rowIn 0.55s var(--spring) both; }

              <div class="appnav"><div><div class="appnav-title">${esc(b.number)}</div><div class="appnav-sub">${esc(b.name)}</div></div><span class="appnav-sub">${esc(b.driver)}</span></div>
              <div class="screen-body">
                <div class="card pad trip-state" id="dv-trip"></div>
                <div class="duo"><div><span class="cap">On board</span><span class="val" id="dv-onboard">0</span></div><div><span class="cap">Next stop</span><span class="val text" id="dv-next">–</span></div></div>
                <p class="footnote">That's all the driver does: Start when leaving, End when finished. Students scan their own ID cards and parents are texted automatically.</p>
                <div class="group-head"><span class="group-title">Door Scanner</span></div>
                <div class="card list feed" id="dv-feed"></div>
                <p class="footnote">A phone fixed by the bus door. Students hold up their ID card as they get on. In this demo they scan on by themselves when the bus reaches their stop.</p>
              </div>
            </div>
            <div class="home-ind"></div>
            <div class="sheet-wrap" id="dv-sheet">
              <div class="sheet">
                <div class="sheet-group"><div class="sheet-msg">End this trip? Parents will stop seeing the bus, and students still on board will be marked as arrived.</div><button class="sheet-btn destructive" id="end-yes">End Trip</button></div>
                <button class="sheet-btn cancel" id="end-no">Keep Driving</button>
              </div>
            </div>
          </div></div>
        </section>
        <section class="device-wrap parent">
          <div class="device-label"><b>Parent's phone</b><span>Opened from the link the school texted</span></div>
          <div class="device"><div class="screen">
            <div class="statusbar"><span class="clock"></span><span class="sys">${signal}${battery}</span></div><div class="island"></div>
            <div class="phone-banners" id="pv-banners"></div>
            <div class="scroll">
              <div class="appnav"><div class="appnav-title">Bus Tracker</div>
                <select id="parent-select" aria-label="Which family">${busParents.map((x) => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${esc(x.name)} · ${esc(everyone().filter((k) => k.parentId === x.id).map((k) => first(k.name)).join(" & "))}</option>`).join("")}</select>
              </div>
              <div class="screen-body">
                <div class="leave" id="pv-leave"><div><div class="leave-card">${I.walk}<div><b>Time to leave</b><span id="pv-leave-text"></span></div></div></div></div>
                <div class="card hero">
                  <div class="eta"><span class="n" id="pv-n">–</span><span class="u" id="pv-u"></span></div>
                  <div class="head" id="pv-head"></div>
                  <div class="meta" id="pv-meta"></div>
                  <div class="kids" id="pv-kids"></div>
                  <button class="btn filled big" id="pv-start" data-start="morning">Start the Demo Bus</button>
                </div>
                <div class="map-tools"><span class="sub" style="font-size:13px">${esc(schoolById(b.schoolId).name)} · ${esc(parishName(schoolById(b.schoolId).parish))}</span>${seg("mapview", "", [["island", "Jamaica"], ["route", "My Route"]], S.mapView)}</div>
                <div class="map" id="pv-map"></div>
                <p class="footnote" style="margin-top:-6px">Drag to move, pinch or scroll to zoom, double-tap to zoom in. Only ${esc(schoolById(b.schoolId).short)}${/s$/.test(schoolById(b.schoolId).short) ? "'" : "'s"} route is shown.${b.demoRoute ? ` Demo route between real towns. ${schoolById(b.schoolId).exact ? "School location: exact." : "School location: town centre until its exact pin is added."}` : ""}</p>
                <div class="group-head"><span class="group-title">Alert Zone</span><button class="btn gray small" id="zone-reset" ${p.zone ? "" : "hidden"}>Back to my stop</button></div>
                <div class="card slider-row">
                  <div class="slider-top"><span>Alert me when the bus is within</span><b id="pv-r">${fmtDist(p.radius)}</b></div>
                  <input type="range" class="ios" id="pv-radius" min="0" max="1000" step="1" value="${rv}" aria-label="Alert zone size" style="--p:${rv / 10}%">
                  <div class="ticks"><span>200 m</span><span>1 km</span><span>5 km</span></div>
                  <span class="footnote" style="margin:0" id="pv-rnote"></span>
                </div>
                <p class="footnote">Drag the orange circle on the map to move your zone, for example further back along the route for an earlier warning. Drag the white dot to resize it.</p>
                <div class="group-head"><span class="group-title">Notifications</span></div>
                <div class="card list toggles">
                  <label class="row"><span class="lbl"><span class="ico" style="background:var(--green)">${I.bubble}</span><span class="main"><span class="title">Text message</span><span class="detail">${esc(p.channel)} to ${esc(p.phone)}</span></span></span><input type="checkbox" class="switch" data-notify="text" ${p.notify.text ? "checked" : ""}></label>
                  <label class="row"><span class="lbl"><span class="ico" style="background:var(--red)">${I.bell}</span><span class="main"><span class="title">Alert on this phone</span><span class="detail">Time-sensitive banner</span></span></span><input type="checkbox" class="switch" data-notify="push" ${p.notify.push ? "checked" : ""}></label>
                  <label class="row"><span class="lbl"><span class="ico" style="background:var(--indigo)">${I.speaker}</span><span class="main"><span class="title">Sound &amp; vibration</span><span class="detail">Chime when the bus enters</span></span></span><input type="checkbox" class="switch" data-notify="sound" ${p.notify.sound ? "checked" : ""}></label>
                  <button class="row tap" id="test-alert" style="color:var(--tint);font-weight:500">Send a Test Alert</button>
                </div>
                <p class="footnote">Students can open the same link on their own phone and set their own zone.</p>
                <div class="group-head"><span class="group-title">${kids.length > 1 ? "Your Children's Bus" : "Your Child's Bus"}</span></div>
                <div class="card list kv">
                  <div class="row"><span class="k">School</span><span class="v">${esc(schoolById(b.schoolId).name)}</span></div>
                  <div class="row"><span class="k">Bus</span><span class="v">${esc(b.number)}</span></div>
                  <div class="row"><span class="k">Plate</span><span class="v mono">${esc(b.plate)}</span></div>
                  <div class="row"><span class="k">Looks like</span><span class="v">${esc(b.description)}</span></div>
                  <div class="row"><span class="k">Route</span><span class="v">${esc(b.name)}</span></div>
                  <div class="row"><span class="k">Your stop</span><span class="v">${esc(stop.name)}</span></div>
                  <div class="row"><span class="k">Driver</span><span class="v">${esc(b.driver)}</span></div>
                  <div class="row"><span class="k">Driver's phone</span><span class="v"><span class="mono" style="user-select:all">${esc(b.driverPhone)}</span><button class="copy" data-copy="${esc(b.driverPhone)}" aria-label="Copy driver's number">${I.copy}</button></span></div>
                </div>
                <p class="footnote">Please only call the driver while the bus is moving if it's urgent.</p>
                <div class="group-head"><span class="group-title">Messages</span></div>
                <div class="card bubbles" id="pv-inbox"></div>
              </div>
            </div>
            <div class="home-ind"></div>
          </div></div>
        </section>
      </div>`;
  };
  function mountBus() {
    const b = bus(S.driverBus);
    const p = S.parents.find((x) => x.id === S.viewParent);
    const stop = b.stops.find((x) => x.id === everyone().find((s) => s.parentId === p.id).stopId);
    if (S.map) S.map.destroy();
    S.map = makeMap($("#pv-map"), b, stop, zoneOf(p, stop), (zn, done) => {
      p.radius = zn.r;
      // Snap back to "my stop" if dropped within 60 m of it.
      p.zone = dist(zn, stop) < 60 ? null : { lat: zn.lat, lng: zn.lng };
      syncZoneUi(p, stop);
      if (done && S.trip) checkZones();
      updateParent();
    });
    syncZoneUi(p, stop);
    requestAnimationFrame(() => S.map && S.map.setBus(busLoc()));
    // Open on the whole of Jamaica, then fly in to this school's route.
    // (Skipped if the person has already moved the map or picked a view.)
    if (S.mapView === "route") { const m = S.map; setTimeout(() => S.map === m && !m.touched && S.mapView === "route" && m.setView("route"), 650); }
    S.inboxCount = -1; S.kidsKey = "";
    renderDriver(); renderFeed(); updateParent(true); tickClock();
  }
  function syncZoneUi(p, stop) {
    const r = $("#pv-radius"); if (!r) return;
    const v = toV(p.radius);
    if (Number(r.value) !== v) r.value = v;
    r.style.setProperty("--p", v / 10 + "%");
    $("#pv-r").textContent = fmtDist(p.radius);
    $("#pv-rnote").textContent = p.zone
      ? `Your zone is set to your own spot on the map. Warning time: about ${etaMin(p.radius)} min.`
      : `Centred on ${stop.name}. Warning time: about ${etaMin(p.radius)} min.`;
    $("#zone-reset").hidden = !p.zone;
  }
  function lockRoute() { const r = $('[data-seg="route"]'); if (r) r.classList.toggle("locked", !!S.trip); }

  function renderDriver() {
    const el = $("#dv-trip"); if (!el) return;
    const t = S.trip;
    el.innerHTML = t
      ? `<div class="trip-title"><span class="live on"></span>${t.direction === "morning" ? "Morning Run" : "Afternoon Run"}</div>
         <div class="sub" style="font-size:14px">${t.arrived ? "Reached the end of the route. Tap End Trip." : "Sharing location. Parents can see the bus."}</div>
         <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="sub" style="font-size:13px">Demo speed</span>${seg("speed", "", [["1", "1×"], ["2", "2×"], ["4", "4×"]], String(S.speed))}</div>
         <button class="btn red big" id="end-trip">End Trip</button>`
      : `<div class="trip-title"><span class="live"></span>Not Running</div>
         <div class="sub" style="font-size:14px">In real use the phone's GPS sends the bus position. In this demo the bus drives the route by itself.</div>
         <button class="btn filled big" data-start="morning">Start Morning Run</button>
         <button class="btn tinted big" data-start="afternoon">Start Afternoon Run</button>`;
    updateDriverLive();
  }
  function updateDriverLive() {
    const ob = $("#dv-onboard"); if (!ob) return;
    const n = String(Object.values(S.boarding).filter((x) => x.type === "on").length);
    if (ob.textContent !== n) ob.textContent = n;
    const t = S.trip, b = bus(S.driverBus);
    let next = "–";
    if (t) {
      const ahead = b.stops.filter((s) => t.stopIdx[s.id] > t.p).sort((a, c) => t.stopIdx[a.id] - t.stopIdx[c.id]);
      next = t.arrived ? "Arrived" : ahead.length ? ahead[0].name : t.direction === "morning" ? "School" : "End of route";
    }
    const nx = $("#dv-next"); if (nx.textContent !== next) nx.textContent = next;
  }
  function renderFeed() {
    const el = $("#dv-feed"); if (!el) return;
    el.innerHTML = S.scans.length
      ? S.scans.slice(0, 7).map((x) => `<div class="row" style="${x.fresh ? "" : "animation:none"}"><span class="scan-ok ${x.type === "off" ? "off" : ""}">${x.type === "on" ? I.check : I.out}</span><div class="main"><span class="title">${esc(x.name)}</span><span class="detail">${x.type === "on" ? "Scanned on" : x.place === "school" ? "Arrived at school" : "Got off at " + esc(x.place)}</span></div><span class="time">${fmtTime(x.at)}</span></div>`).join("")
      : `<div class="empty">${S.trip ? "Waiting for the first stop…" : "No scans yet. Start a run."}</div>`;
    S.scans.forEach((x) => (x.fresh = false));
    updateDriverLive();
  }

  function updateParent(force) {
    const head = $("#pv-head"); if (!head) return;
    const b = bus(S.driverBus), t = S.trip;
    const p = S.parents.find((x) => x.id === S.viewParent);
    const kids = everyone().filter((s) => s.parentId === p.id);
    const stop = b.stops.find((x) => x.id === kids[0].stopId);
    const loc = busLoc();
    const allOn = t && kids.every((k) => S.boarding[k.id] && S.boarding[k.id].type === "on");
    const end = b.route[b.route.length - 1];
    let n = "–", u = "", h, meta = "", leave = false;
    if (!t) {
      const done = kids.every((k) => S.boarding[k.id] && S.boarding[k.id].place === "school");
      h = done ? `${kids.length > 1 ? "Your children" : first(kids[0].name)} arrived at school` : `${b.number} isn't running`;
      meta = done ? `${b.number} · ${b.name}` : "This page updates by itself when the driver starts the trip.";
    } else if (t.direction === "morning" && allOn) {
      const d = dist(loc, { lat: end[0], lng: end[1] });
      n = t.arrived ? "0" : String(etaMin(d)); u = "min";
      h = `${kids.length > 1 ? "Your children are" : first(kids[0].name) + " is"} on the bus`;
      meta = t.arrived ? "Pulling in at school" : `to school · ${fmtDist(d)} away`;
    } else {
      const d = dist(loc, stop), passed = t.p > t.stopIdx[stop.id] + 1;
      n = passed ? "–" : String(etaMin(d)); u = passed ? "" : "min";
      h = passed ? `${b.number} has passed ${stop.name}` : `to ${stop.name}`;
      meta = passed ? "" : `${fmtDist(d)} away · ${b.number} · updated just now`;
      leave = t.direction === "morning" && !passed && dist(loc, zoneOf(p, stop)) <= p.radius;
      if (leave) $("#pv-leave-text").textContent = `${b.number} is about ${etaMin(d)} min from ${stop.name}.`;
    }
    $("#pv-n").textContent = n; $("#pv-u").textContent = u;
    if (head.textContent !== h) head.textContent = h;
    $("#pv-meta").textContent = meta;
    $("#pv-leave").classList.toggle("show", leave);
    $("#pv-start").hidden = !!t || kids.some((k) => S.boarding[k.id]);

    const kidsHtml = kids.map((k) => {
      const st = S.boarding[k.id];
      const cls = !st ? "" : st.type === "on" ? "on" : "done";
      const text = !st ? "Not on the bus yet" : st.type === "on" ? `On the bus · ${fmtTime(st.at)}` : st.place === "school" ? `At school · ${fmtTime(st.at)}` : `Got off · ${fmtTime(st.at)}`;
      return `<div class="kid ${cls}"><b>${esc(first(k.name))}</b><span>${text}</span></div>`;
    }).join("");
    if (force || kidsHtml !== S.kidsKey) { $("#pv-kids").innerHTML = kidsHtml; S.kidsKey = kidsHtml; }

    const mine = S.messages.filter((m) => m.parent.id === p.id);
    if (force || mine.length !== S.inboxCount) {
      const prev = S.inboxCount;
      S.inboxCount = mine.length;
      const box = $("#pv-inbox");
      const list = mine.slice(0, 8).reverse();
      const fresh = prev >= 0 ? mine.length - prev : 0;
      box.innerHTML = list.length
        ? list.map((m, i) => `<div class="bubble ${i >= list.length - fresh ? "pop" : ""}">${esc(m.body)}</div>`).join("") + `<div class="bubble-time">${esc(p.channel)} · ${fmtTime(list[list.length - 1].at)}</div>`
        : `<div class="empty">No messages yet. Start the bus to see the texts this parent gets.</div>`;
      box.scrollTop = box.scrollHeight;
    }
  }

  views.office = () => {
    const att = S.attendance;
    const marked = Object.keys(att).length;
    const absent = Object.values(att).filter((v) => v === "absent").length;
    const late = Object.values(att).filter((v) => v === "late").length;
    const waiting = lunchWaiting();
    const audiences = [["all", "All parents"], ...activeClasses().map((c) => ["class:" + c.id, c.name + " parents"]), ...buses.map((b) => ["bus:" + b.id, b.name])];
    return `
      <div class="largetitle"><h1>Today</h1><p>${fmtDate(todayISO(), true)}. Take the register and parents of absent or late students are texted automatically.</p></div>
      <div class="stats">
        <div class="stat" style="--c:var(--green)"><span class="stat-label">${I.people}At school</span><span class="stat-value">${marked ? marked - absent : "–"}<small>/ ${S.students.length}</small></span><span class="stat-note">${marked ? "From today's registers" : "Register not taken yet"}</span></div>
        <div class="stat" style="--c:var(--red)"><span class="stat-label">${I.away}Absent</span><span class="stat-value">${absent}</span><span class="stat-note">${late} late</span></div>
        <div class="stat" style="--c:var(--orange)"><span class="stat-label">${I.fork}Lunch</span><span class="stat-value">${Object.keys(S.lunch).length}</span><span class="stat-note">${waiting} at school, not collected</span></div>
        <div class="stat" style="--c:var(--tint)"><span class="stat-label">${I.bubble}Texts sent</span><span class="stat-value">${S.messages.length}</span><span class="stat-note">To parents today</span></div>
      </div>
      <div class="cols">
        <section class="group">
          <div class="group-head"><span class="group-title">Register</span>${seg("regclass", "", activeClasses().map((c) => [c.id, c.name]), S.regClass)}</div>
          <div class="card list" id="reg-list">${regList()}</div>
          <p class="footnote">Everyone starts as present. Tap who is late or absent, then save.</p>
          <div style="padding-top:6px"><button class="btn filled big" id="save-reg">Save Register &amp; Text Parents</button></div>
        </section>
        <section class="group">
          <div class="group-head"><span class="group-title">Lunch</span><button class="btn tinted small" id="lunch-alerts" ${waiting ? "" : "disabled"}>Text ${plural(waiting, "parent")}</button></div>
          <div class="card list">${S.students.filter((s) => s.path).map((s) => { const a = att[s.id]; return `
            <div class="row"><div class="main"><span class="title">${esc(s.name)}<span class="tag path">PATH</span></span><span class="detail">${a ? (a === "absent" ? "Absent today" : "At school") : "Register not taken"}</span></div>
              ${S.lunch[s.id] ? `<span style="color:var(--green-ink);font-weight:600;font-size:14px;display:flex;gap:4px;align-items:center">${I.check}${fmtTime(S.lunch[s.id])}</span>` : S.lunchAlerted[s.id] ? `<span style="color:var(--red);font-weight:600;font-size:14px">Parent texted</span>` : `<button class="btn gray small" data-lunch="${s.id}">Collected</button>`}
            </div>`; }).join("")}</div>
          <p class="footnote">Your kitchen system marks lunches automatically. Here you can tap instead.</p>
        </section>
      </div>
      <section class="group">
        <div class="group-head"><span class="group-title">Message Parents</span></div>
        <div class="card pad" style="display:grid;gap:14px">
          <label class="field"><span class="field-label">Send to</span>
            <select class="ios" id="aud">${audiences.map(([v, l]) => `<option value="${v}">${esc(l)} (${audienceParents(v).length})</option>`).join("")}</select></label>
          <div class="chips">
            <button class="chip" data-tpl="School is CLOSED tomorrow because of the weather. Please keep your child at home and stay safe. We will text when school reopens.">Weather closure</button>
            <button class="chip" data-tpl="Early dismissal today at 12:00 noon. Please arrange to collect your child.">Early dismissal</button>
            <button class="chip" data-tpl="EMERGENCY: All students are safe and are being kept at school. Please do not come until we text you again.">Emergency – students safe</button>
            <button class="chip" data-tpl="Reminder: PTA meeting this Thursday at 4:00 p.m. in the school hall. All parents are welcome.">PTA meeting</button>
          </div>
          <label class="field"><span class="field-label">Message</span><textarea class="ios" id="bc-body" rows="4" maxlength="480" placeholder="Tap here and type your message…" autocomplete="off" spellcheck="true">${esc(S.bcDraft)}</textarea></label>
          <div class="counter" id="bc-count">${S.bcDraft.length}/480</div>
          <button class="btn filled big" id="bc-send">Send to Every Parent's Phone</button>
        </div>
      </section>`;
  };
  function regList() {
    return S.students.filter((s) => s.classId === S.regClass).map((s) => {
      const v = S.draftReg[s.id] || S.attendance[s.id] || "present";
      return `<div class="row"><div class="main"><span class="title">${esc(s.name)}${s.path ? '<span class="tag path">PATH</span>' : ""}</span></div>
        ${seg("reg", s.id, [["present", "Present", "g"], ["late", "Late", "o"], ["absent", "Absent", "r"]], v)}</div>`;
    }).join("");
  }
  function lunchWaiting() {
    return S.students.filter((s) => s.path && S.attendance[s.id] && S.attendance[s.id] !== "absent" && !S.lunch[s.id] && !S.lunchAlerted[s.id]).length;
  }
  function audienceParents(a) {
    let list = S.students;
    if (a.startsWith("class:")) list = list.filter((s) => s.classId === a.slice(6));
    if (a.startsWith("bus:")) list = list.filter((s) => s.busId === a.slice(4));
    const ids = new Set(list.map((s) => s.parentId));
    return S.parents.filter((p) => ids.has(p.id));
  }

  function sbaBehind() {
    return S.students
      .filter((s) => !S.sbaClass || s.classId === S.sbaClass)
      .map((s) => ({ s, items: S.sbas.filter((c) => c.classId === s.classId && daysUntil(c.due) <= 14 && S.progress[c.id + "|" + s.id] !== "submitted").sort((a, b) => daysUntil(a.due) - daysUntil(b.due)) }))
      .filter((r) => r.items.length)
      .sort((a, b) => daysUntil(a.items[0].due) - daysUntil(b.items[0].due));
  }
  views.sba = () => `
    <div class="largetitle"><h1>SBA Tracker</h1><p>CSEC school-based assessments. Anyone with work due in the next 14 days or overdue shows up here, and one tap texts their parents.</p></div>
    ${seg("sbaclass", "", [["", "All"], ...activeClasses().map((c) => [c.id, c.name])], S.sbaClass, "lg")}
    <div id="sba-body" style="display:grid;gap:26px">${sbaBody()}</div>`;
  function sbaBehindHtml() {
    const behind = sbaBehind();
    return `<div class="group-head"><span class="group-title">Behind</span><button class="btn tinted small" id="sba-alerts" ${behind.length ? "" : "disabled"}>Text ${plural(behind.length, "parent")}</button></div>
      <div class="card list">${behind.length ? behind.map(({ s, items }) => `
        <div class="row" style="align-items:flex-start"><div class="main" style="min-width:140px"><span class="title" style="font-weight:600">${esc(s.name)}</span><span class="detail">${cname(s.classId)}</span></div>
          <div style="display:grid;gap:5px;flex:1;min-width:0">${items.map((i) => `<div class="sba-line"><span>${esc(i.subject)}</span><span class="due ${dueClass(daysUntil(i.due))}">${dueLabel(daysUntil(i.due))}</span></div>`).join("")}</div>
        </div>`).join("") : `<div class="empty">Nobody is behind.</div>`}</div>`;
  }
  function sbaBody() {
    const list = S.sbas.filter((c) => !S.sbaClass || c.classId === S.sbaClass).sort((a, b) => a.due.localeCompare(b.due));
    return `<section class="group" id="sba-behind">${sbaBehindHtml()}</section>
      <section class="group">
        <div class="group-head"><span class="group-title">All SBAs</span></div>
        <div class="card list">${list.map((c) => {
          const studs = S.students.filter((s) => s.classId === c.classId);
          const done = studs.filter((s) => S.progress[c.id + "|" + s.id] === "submitted").length;
          const d = daysUntil(c.due), open = S.openSba === c.id;
          return `<div class="${open ? "open" : ""}" data-sba-wrap="${c.id}">
            <button class="row tap" data-open-sba="${c.id}" aria-expanded="${open}">

    if (d.openSba) {
      const wrap = el.closest("[data-sba-wrap]"), ex = $(".expand", wrap), open = !ex.classList.contains("open");
      $$(".expand.open").forEach((x) => { if (x !== ex) { x.classList.remove("open"); x.parentElement.classList.remove("open"); } });
      ex.classList.toggle("open", open); wrap.classList.toggle("open", open); el.setAttribute("aria-expanded", String(open));
      S.openSba = open ? d.openSba : null;
      return;
    }
    if (el.id === "reset") {
      cancelAnimationFrame(S.raf); if (S.map) S.map.destroy();
      const tab = S.tab; S = freshState(); S.tab = tab; document.body.classList.remove("in-thread"); $("#view").classList.remove("in-thread");
      render(); updateBadge();
      banner({ app: "School Connect", title: "Demo reset", body: "Everything is back to the start." });
    }
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "reg-form") registerStudent(e.target);
    if (e.target.id === "signin-form") signIn(e.target);
  });
  // Enter sends, Shift+Enter makes a new line (on a computer keyboard).
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "composer" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendFromComposer(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "bus-school") { const nb = buses.find((x) => x.schoolId === e.target.value); S.driverBus = nb.id; S.boarding = {}; S.scans = []; S.viewParent = null; return rerenderKeepScroll(); }
    if (e.target.id === "compose-to") S.composeTo = e.target.value;
    if (e.target.form && e.target.form.id === "reg-form" && ["parish", "schoolId", "grade"].includes(e.target.name)) onRegChange(e.target.form, e.target.name);
    if (e.target.id === "parent-select") { S.viewParent = e.target.value; rerenderKeepScroll(); }
    if (e.target.dataset.notify) { const p = S.parents.find((x) => x.id === S.viewParent); p.notify[e.target.dataset.notify] = e.target.checked; }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "bc-body") { S.bcDraft = t.value; growBox(t); }
    if (t.id === "stu-search") { S.stu.q = t.value; $("#stu-list").innerHTML = stuList(); }
    if (t.id === "parish-search") { S.stu.pq = t.value; $("#parish-list").innerHTML = parishRows(); }
    if (t.id === "school-search") { S.stu.sq = t.value; $("#school-list").innerHTML = schoolRows(); }
    if (t.id === "composer") { S.drafts[S.thread || "new"] = t.value; growComposer(t); $("#send-msg").disabled = !t.value.trim(); }
    if (t.id === "pv-radius") {
      const p = S.parents.find((x) => x.id === S.viewParent);
      const stop = bus(S.driverBus).stops.find((x) => x.id === everyone().find((s) => s.parentId === p.id).stopId);
      p.radius = toR(Number(t.value));
      syncZoneUi(p, stop);
      if (S.map) S.map.setZone({ r: p.radius });
      if (S.trip) checkZones();
      updateParent();
    }
  });
  function growBox(ta) {
    ta.style.height = "auto";
    ta.style.height = Math.max(110, ta.scrollHeight) + "px";
    const c = $("#bc-count"); if (c) c.textContent = `${ta.value.length}/480`;
  }
  // Like iOS: hide the floating tab bar while the keyboard is up, so it never
  // sits on top of the box you're typing in, and bring the box into view.
  const isField = (el) => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "range"));
  document.addEventListener("focusin", (e) => {
    if (!isField(e.target)) return;
    document.body.classList.add("typing");
    setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }), 300);
  });
  document.addEventListener("focusout", (e) => { if (isField(e.target)) setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove("typing"); }, 50); });

  let wasFramed = framed();
  window.addEventListener("resize", () => { if (framed() !== wasFramed) { wasFramed = framed(); if (S.tab === "bus") rerenderKeepScroll(); } });

  const h = (location.hash || "").slice(1);
  if (views[h]) S.tab = h;
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (views[k] && k !== S.tab) go(k); });
  render();
})();
</script>
