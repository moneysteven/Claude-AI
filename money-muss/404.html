<style>
:root {
  --navy: #2B2F3A; --navy-deep: #1E2129; --cream: #EFE6C8; --rose: #C0697A; --crimson: #8E1B1B; --ink: #2B2F3A; --yellow: #E9B949;
  --font-display: "Gloock", Georgia, "Times New Roman", serif;
  --font-mono: "DM Mono", "Courier New", Courier, monospace;
  /* The same motion system as the rest of the site. */
  --dur-1: 200ms; --dur-2: 350ms; --dur-3: 600ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --spring-smooth: var(--ease-out);
  --spring-snappy: var(--ease-out);
  color-scheme: dark;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring-smooth: linear(0, 0.065, 0.193, 0.337, 0.472, 0.593, 0.689, 0.765, 0.825, 0.87, 0.906, 0.931, 0.95, 0.964, 0.974, 0.981, 0.987, 0.991, 0.993, 0.995, 0.997, 0.998, 0.998, 0.999, 1);
    --spring-snappy: linear(0, 0.099, 0.3, 0.525, 0.725, 0.885, 0.988, 1.046, 1.071, 1.072, 1.061, 1.045, 1.029, 1.015, 1.005, 0.999, 0.996, 0.995, 0.995, 0.996, 0.997, 0.998, 0.999, 1, 1);
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--navy-deep); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; align-items: center;
  padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
  background-color: var(--navy); color: var(--cream);
  /* A fine dot screen, like the foil on the scratch card. */
  background-image: radial-gradient(circle at 50% 50%, rgba(239, 230, 200, 0.07) 0 1.5px, transparent 2px); background-size: 14px 14px;
  font: 500 0.9375rem/1.7 var(--font-mono);
  -webkit-font-smoothing: antialiased;
}
.sprite { position: absolute; }
.lost { width: min(100%, 880px); margin-inline: auto; }
.lost__logo { display: block; width: 84px; height: 84px; }
.lost__title { margin: clamp(22px, 5vw, 44px) 0 0; overflow: hidden; padding-bottom: 0.12em; font: 400 clamp(4.75rem, 24vw, 15rem) / 0.86 var(--font-display); letter-spacing: -0.035em; }
.lost__title span { display: block; }
.lost__title em { color: var(--rose); font-style: normal; }
.lost__text { margin: clamp(18px, 3vw, 30px) 0 0; max-width: 34em; }
.lost__where { margin: 10px 0 0; max-width: 34em; color: #CFC9B6; }
.lost__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 22px 34px; margin-top: clamp(30px, 5vw, 48px); }

/* "Back to the front": a ticket with a tear-off stub. The printed shadow is a twin of its shape that stays put,
   so when the ticket lifts under the pointer the shadow beneath it deepens. */
.stubbtn {
  --bite: 7px;
  --perf: radial-gradient(circle var(--bite) at 0 50%, #0000 96%, #000) 0 0 / 51% calc(var(--bite) * 3) repeat-y, radial-gradient(circle var(--bite) at 100% 50%, #0000 96%, #000) 100% 0 / 51% calc(var(--bite) * 3) repeat-y;
  position: relative; isolation: isolate; display: inline-block; max-width: 100%; color: var(--ink); text-decoration: none; rotate: -1.4deg;
  transition: transform var(--dur-2) var(--spring-snappy);
}
.stubbtn::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--crimson); transform: translate(5px, 6px); -webkit-mask: var(--perf); mask: var(--perf); }
.stubbtn__paper { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 84px; background: var(--cream); -webkit-mask: var(--perf); mask: var(--perf); transition: transform var(--dur-2) var(--spring-snappy); }
.stubbtn__main { display: flex; align-items: center; padding: 16px 26px 14px 30px; font: 400 clamp(1.625rem, 6.4vw, 2.25rem) / 1 var(--font-display); letter-spacing: -0.015em; }
.stubbtn__stub { display: grid; place-items: center; padding: 0 24px 0 16px; border-left: 2px dashed rgba(43, 47, 58, 0.55); color: var(--crimson); font: 500 0.6875rem/1.3 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; }
.stubbtn__stub b { display: block; font-weight: 500; }
/* Focus: it steps forward and a soft cream ring comes up around it, on top of the outline. */
.stubbtn::before, .lost__tel::before { content: ""; position: absolute; inset: -8px; pointer-events: none; box-shadow: 0 0 0 2px rgba(239, 230, 200, 0.92), 0 0 22px 6px rgba(239, 230, 200, 0.5); opacity: 0; transition: opacity var(--dur-1) var(--ease-out); }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 5px; }
.stubbtn:focus-visible, .lost__tel:focus-visible { transform: scale(1.03); }
.stubbtn:focus-visible::before, .lost__tel:focus-visible::before { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .stubbtn:hover .stubbtn__paper { transform: translate(0, -5px); } }
/* Pressed, it squeezes to 97% in a fifth of a second; let go, and it springs back. */
.stubbtn:active, .lost__tel:active { transform: scale(0.97); transition-duration: var(--dur-1); transition-timing-function: var(--spring-smooth); }

.lost__tel { position: relative; display: inline-flex; align-items: center; min-height: 48px; color: var(--cream); text-underline-offset: 0.3em; text-decoration-thickness: 2px; text-decoration-color: var(--rose); transition: transform var(--dur-2) var(--spring-snappy); }

/* The headline rises once out of a masked baseline, like the headlines on the main page. */
@media (prefers-reduced-motion: no-preference) {
  .lost__title span { animation: rise var(--dur-3) var(--spring-smooth) 120ms both; }
  @keyframes rise { from { transform: translateY(112%); } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
  :focus-visible { transform: none !important; }
}
@media (forced-colors: active) { .stubbtn__paper { border: 1px solid CanvasText; } }

/* The two fonts are built into this page, but the browser still takes a few milliseconds to unpack them.
   Until it has, the text is held back (by the short script below), so it is never drawn in a system font
   first and then moved when the real one arrives. The headline waits with it before it rises. */
.fonts-wait .lost { visibility: hidden; }
.fonts-wait .lost__title span { animation-play-state: paused; }
</style>
<script>
/* Holds the text back until the page's two built-in fonts are ready and the page has been read to the end
   (the block sits in the middle of the screen, so it would move if it were drawn half-read). Without scripts,
   or in a browser that cannot tell, the text simply shows at once. It can never stay hidden: it is shown
   after 0.8s regardless. */
(function (d) {
  var root = d.documentElement;
  if (!d.fonts || !d.fonts.load || !window.Promise) return;
  var show = function () { root.classList.remove('fonts-wait'); };
  var read = new Promise(function (done) { if (d.readyState !== 'loading') done(); else d.addEventListener('DOMContentLoaded', done); });
  root.classList.add('fonts-wait');
  Promise.all([d.fonts.load('400 1em Gloock'), d.fonts.load('500 1em "DM Mono"'), read]).then(show, show);
  setTimeout(show, 800);
})(document);
</script>
</head>
